<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account - Watch2Earn</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.gamemonetize.com/sdk.js" data-game-id="7ubj0focn2ah0c9km8a4bxzskl6emjuy"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#fff;font-family:Segoe UI,Arial,sans-serif;padding-bottom:85px}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#0f0f0f;border-bottom:1px solid #222;position:sticky;top:0;z-index:100}
.top-left{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px}
.logo span{color:#4CAF50}
.site-logo{height:36px}
.top-actions{display:flex;gap:10px}
.icon-btn{width:38px;height:38px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none}
.container{max-width:560px;margin:0 auto;padding:16px}
.main-balance{background:linear-gradient(135deg,#111,#1a2e1a);border:1px solid #2a4a2a;border-radius:20px;padding:20px;margin-bottom:14px}
.main-balance h1{font-size:42px;font-weight:900}
.breakdown{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.break-item{background:#0f0f0f;border:1px solid #222;border-radius:10px;padding:8px 12px;flex:1;min-width:70px;text-align:center}
.break-item small{color:#777;font-size:10px;display:block}
.break-item b{font-size:13px;color:#4CAF50}
.btn{flex:1;padding:12px;border-radius:12px;border:none;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-withdraw{background:#4CAF50;color:#fff}
.btn-history{background:#1a1a1a;border:1px solid #2a2a2a;color:#fff}
.card{background:#111;border:1px solid #222;border-radius:16px;padding:16px;margin-bottom:14px}
.ref-box{display:flex;gap:8px;margin-top:10px}
.ref-box input{flex:1;background:#0f0f0f;border:1px solid #222;border-radius:10px;padding:10px;color:#fff;font-size:12px}
.ref-box button{background:#4CAF50;border:none;color:#fff;padding:10px 14px;border-radius:10px;font-weight:700}
.menu-item{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #1a1a1a;color:#fff;text-decoration:none}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#0f0f0f;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px 0;max-width:560px;margin:0 auto}
.bottom-nav a{color:#666;text-decoration:none;font-size:11px;text-align:center}
.bottom-nav a.active{color:#4CAF50}
.bottom-nav a i{display:block;font-size:20px}
.invite-details{display:none;margin-top:14px;padding-top:14px;border-top:1px solid #222}
.invite-details.open{display:block}
.announcement{background:#1a1a1d;padding:12px;border-radius:12px;margin-bottom:14px;color:#fff}
.announcement i{color:#4CAF50;margin-right:6px}
.user-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#bbb;font-size:12px}
@media (min-width: 768px){
  .container{max-width:760px}
}
@media (max-width:480px){
  body{font-size:18px}
  .container{padding:20px}
  .site-logo{height:44px}
  .main-balance h1{font-size:36px}
  .break-item b{font-size:15px}
}
</style>
<script src="https://pl30708906.profitableratecpmnetwork.com/f2/0a/64/f20a64eb43c44172c8e55cd3d4f83180.js"></script>
<script>
(function () {
  const sameOrigin = new URL(location.href).origin;
  function isAllowedUrl(url) {
    try {
      const u = new URL(url, location.href);
      return u.origin === sameOrigin || u.hostname === 't.me' || u.hostname.endsWith('watch2earn.com') || u.hostname.endsWith('watch2earn.net') || u.hostname.endsWith('watch2earn.app');
    } catch (error) {
      return true;
    }
  }

  const realOpen = window.open;
  window.open = function (url, name, specs) {
    if (!url) return realOpen.call(this, url, name, specs);
    return isAllowedUrl(url) ? realOpen.call(this, url, name, specs) : null;
  };

  document.addEventListener('click', function (event) {
    const link = event.target && event.target.closest ? event.target.closest('a') : null;
    if (!link || !link.href) return;
    if (!isAllowedUrl(link.href)) {
      event.preventDefault();
      event.stopImmediatePropagation();
    }
  }, true);
})();
