<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manage Ads - Admin</title>
  <link rel="stylesheet" href="/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body{font-family:Segoe UI,Arial,sans-serif;padding:0;color:#fff;background:#0b0c0f;padding-bottom:90px}
    .top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:#121214;border-bottom:1px solid #232326;position:sticky;top:0;z-index:10}
    .logo{font-weight:900;font-size:20px;color:#4CAF50}
    .container{max-width:960px;margin:0 auto;padding:16px}
    .card{background:#1a1a1d;padding:16px;border-radius:12px;margin-bottom:12px;border:1px solid #232326}
    input,button{padding:10px;border-radius:8px;border:1px solid #333;background:#222326;color:#fff;margin:6px 0;font-size:14px}
    button{cursor:pointer;background:#4CAF50;font-weight:700;border:none}
    button:hover{background:#45a049}
    .list{display:grid;gap:12px;margin-top:16px}
    .item{background:#141417;border:1px solid #232326;border-radius:10px;padding:14px;display:flex;justify-content:space-between;align-items:center}
    .item-info{flex:1}
    .item-actions{display:flex;gap:8px}
    .item-actions button{padding:8px 12px;font-size:12px;margin:0}
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#121214;border-top:1px solid #232326;display:flex;justify-content:space-around;padding:10px 0;z-index:20}
    .bottom-nav a{color:#888;text-decoration:none;font-size:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
    .bottom-nav a.active{color:#4CAF50;font-weight:700}
  </style>
</head>
<body>
  <div class="top">
    <div class="logo"><i class="fas fa-volume-up"></i> Ads Manager</div>
    <a href="inbox.html" style="display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:#18181b;border:1px solid #2f2f32;color:#fff;text-decoration:none" title="Inbox"><i class="fas fa-inbox"></i></a>
  </div>

  <div class="container">
    <h2>Create New Ad</h2>
    <div class="card">
      <div style="margin-bottom:12px">
        <label style="display:block;margin-bottom:6px;font-weight:600">Title</label>
        <input id="title" placeholder="e.g., Premium Offer" style="width:100%">
      </div>
      <div style="margin-bottom:12px">
        <label style="display:block;margin-bottom:6px;font-weight:600">Duration (seconds)</label>
        <input id="seconds" type="number" value="15" min="5" max="120" style="width:100%">
      </div>
      <div style="margin-bottom:12px">
        <label style="display:block;margin-bottom:6px;font-weight:600">Type</label>
        <select id="type" style="width:100%;padding:10px;border-radius:8px;border:1px solid #333;background:#222326;color:#fff">
          <option value="ad">Ad</option>
          <option value="survey">Survey</option>
          <option value="game">Game</option>
          <option value="bonus">Bonus</option>
        </select>
      </div>
      <button id="create" style="width:100%"><i class="fas fa-plus"></i> Create Ad</button>
    </div>

    <h2 style="margin-top:24px">Active Ads</h2>
    <div id="list" class="list">Loading...</div>
  </div>

  <div class="bottom-nav">
    <a href="carbinate.html"><i class="fas fa-house"></i>Home</a>
    <a href="users.html"><i class="fas fa-users"></i>Users</a>
    <a href="ads.html" class="active"><i class="fas fa-volume-up"></i>Ads</a>
    <a href="withdrawals.html"><i class="fas fa-wallet"></i>Withdrawals</a>
    <a href="messages.html"><i class="fas fa-envelope"></i>Messages</a>
  </div>

  <script>
    const adminToken = localStorage.getItem('adminToken');
    if (!adminToken) {
      location.href = '/admin-panel/verify.html';
    }

    async function load(){
      try {
        const res = await fetch('/api/ads', {
          headers: { 'Authorization': `Bearer ${adminToken}` }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const ads = await res.json();
        const list = document.getElementById('list');
        
        if (!ads || ads.length === 0) {
          list.innerHTML = '<div style="text-align:center;color:#777;padding:40px 20px">No ads created yet. Create your first ad above!</div>';
          return;
        }

        list.innerHTML = ads.map(a => `
          <div class="item">
            <div class="item-info">
              <div style="font-weight:700;color:#fff">${escapeHtml(a.title || 'Untitled')}</div>
              <div style="color:#999;font-size:13px;margin-top:4px">Duration: ${a.seconds}s • Type: ${escapeHtml(a.type || 'ad')}</div>
              <div style="color:#777;font-size:12px;margin-top:4px">Created: ${new Date(a.createdAt || Date.now()).toLocaleDateString()}</div>
            </div>
            <div class="item-actions">
              <button onclick="deleteAd('${escapeHtml(a.id)}')"><i class="fas fa-trash"></i> Delete</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
        document.getElementById('list').innerHTML = '<div style="color:#f44336;padding:20px">Failed to load ads: ' + err.message + '</div>';
      }
    }

    document.getElementById('create').addEventListener('click', async () => {
      const title = document.getElementById('title').value.trim();
      const seconds = Number(document.getElementById('seconds').value || 15);
      const type = document.getElementById('type').value || 'ad';

      if (!title) {
        alert('Please enter an ad title');
        return;
      }

      try {
        const res = await fetch('/api/ads', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${adminToken}`
          },
          body: JSON.stringify({ title, seconds, type })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        document.getElementById('title').value = '';
        document.getElementById('seconds').value = '15';
        load();
      } catch (err) {
        alert('Failed to create ad: ' + err.message);
      }
    });

    async function deleteAd(id) {
      if (!confirm('Are you sure you want to delete this ad?')) return;
      try {
        const res = await fetch(`/api/ads/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${adminToken}` }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        load();
      } catch (err) {
        alert('Failed to delete ad: ' + err.message);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    load();
  </script>
</body>
</html>
