<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Dashboard</title>
  <!-- Admin CSS -->
<link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0b0c0f;color:#e0e0e0;font-family:'Segoe UI',Inter,Arial,sans-serif;padding-bottom:90px}
    .top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:#121214;border-bottom:1px solid #232326;position:sticky;top:0;z-index:10}
    .logo{font-weight:900;font-size:20px;color:#4CAF50}
    .container{max-width:960px;margin:0 auto;padding:16px}
    .card{background:#1a1a1d;border:1px solid #232326;border-radius:20px;padding:20px;margin-bottom:14px;transition:transform .2s}
    .card:hover{transform:scale(1.02)}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
    .stat{background:#222326;border:1px solid #333;border-radius:16px;padding:16px;text-align:center}
    .stat b{display:block;font-size:22px;color:#4CAF50}
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#121214;border-top:1px solid #232326;display:flex;justify-content:space-around;padding:10px 0;z-index:20}
    .bottom-nav a{color:#888;text-decoration:none;font-size:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
    .bottom-nav a.active{color:#4CAF50;font-weight:700}
    .logout{color:#f44336;font-weight:bold;text-decoration:none}
  </style>
</head>
<body>
  <div class="top">
    <div class="logo">Admin <span>Panel</span></div>
    <a href="/logout" class="logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
  </div>
  <div class="container">
    <h2>Dashboard</h2>
    <div class="stats">
      <div class="stat">
        <small>Total Balance</small>
        <b id="totalBalance">$0</b>
      </div>
      <div class="stat">
        <small>Profit</small>
        <b id="profit">$0</b>
      </div>
      <div class="stat">
        <small>User Profit</small>
        <b id="userProfit">$0</b>
      </div>
    </div>
    <div class="card">
      <h3>Overview</h3>
      <p id="usersCount">Users: 0</p>
      <p id="withdrawalsCount">Withdrawals: 0</p>
      <p id="revenueCount">Revenue: $0</p>
    </div>
    <div class="card">
      <h3>Recent Activity</h3>
      <div id="recentActivity"></div>
    </div>
  </div>
  <div class="bottom-nav">
    <a href="/admin-panel/carbinate.html" class="active"><i class="fas fa-house"></i>Home</a>
    <a href="/admin-panel/users.html"><i class="fas fa-users"></i>Users</a>
    <a href="/admin-panel/withdrawals.html"><i class="fas fa-wallet"></i>Withdrawals</a>
    <a href="/admin-panel/past.html"><i class="fas fa-clock-rotate-left"></i>History</a>
    <a href="/admin-panel/charts.html"><i class="fas fa-chart-line"></i>Charts</a>
    <a href="/admin-panel/messages.html"><i class="fas fa-envelope"></i>Messages</a>
  </div>
  <script>
    // Check if authenticated
    function checkAuth() {
      const token = localStorage.getItem('adminToken');
      if (!token) {
        location.href = '/admin-panel/verify.html';
        return false;
      }
      return true;
    }

    // Fetch dashboard data with error handling
    async function loadDashboard() {
      try {
        const token = localStorage.getItem('adminToken');
        const res = await fetch('/api/admin/dashboard', {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          credentials: 'include'
        });
        
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        
        document.getElementById('totalBalance').textContent = `$${data.totalBalance || 0}`;
        document.getElementById('profit').textContent = `$${data.profit || 0}`;
        document.getElementById('userProfit').textContent = `$${data.userProfit || 0}`;
        document.getElementById('usersCount').textContent = `Users: ${data.users || 0}`;
        document.getElementById('withdrawalsCount').textContent = `Pending Withdrawals: ${data.withdrawals || 0}`;
        document.getElementById('revenueCount').textContent = `Revenue: $${data.revenue || 0}`;
        document.getElementById('recentActivity').innerHTML = (data.activity || []).map(a=>`<p><i class="fas fa-check-circle" style="color:#4CAF50;margin-right:8px;"></i>${a}</p>`).join('');
      } catch(err) {
        console.error('Dashboard load error:', err);
        document.getElementById('recentActivity').innerHTML = `<p style="color:#f44336;"><i class="fas fa-exclamation-circle"></i> Unable to load data: ${err.message}</p>`;
      }
    }

    if (checkAuth()) {
      loadDashboard();
    }
  </script>
</body>
</html>
