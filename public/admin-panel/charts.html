<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Charts</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
  <style>
    body { background:#0b0c0f; color:#e0e0e0; font-family:'Segoe UI',Inter,Arial,sans-serif; padding-bottom:90px; }
    h1,h2 { color:#4CAF50; }
    .chart-container { height:400px; width:100%; background:#121214; padding:12px; border-radius:12px; }
    table { background:#1a1a1d; color:#e0e0e0; }
    th { color:#4CAF50; }
    tr:hover { background:#1f2023; }
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#121214;border-top:1px solid #232326;display:flex;justify-content:space-around;padding:10px 0;z-index:20}
    .bottom-nav a{color:#888;text-decoration:none;font-size:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
    .bottom-nav a.active{color:#4CAF50;font-weight:700}
  </style>
</head>
<body>
  <div class="container mt-5">
    <h1>Admin Analytics</h1>
    <div class="row">
      <div class="col-md-6">
        <h2>Earnings Chart</h2>
        <div class="chart-container"><canvas id="earningsChart"></canvas></div>
      </div>
      <div class="col-md-6">
        <h2>Ads Watched Chart</h2>
        <div class="chart-container"><canvas id="adsWatchedChart"></canvas></div>
      </div>
    </div>
    <div class="row mt-5">
      <div class="col-md-12">
        <h2>Earnings Summary</h2>
        <table class="table table-striped">
          <thead><tr><th>Time Period</th><th>Earnings</th></tr></thead>
          <tbody>
            <tr><td>Last 1 Day</td><td id="earnings-1-day"></td></tr>
            <tr><td>Last 7 Days</td><td id="earnings-7-days"></td></tr>
            <tr><td>Last 30 Days</td><td id="earnings-30-days"></td></tr>
            <tr><td>Last 90 Days</td><td id="earnings-90-days"></td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="row mt-5">
      <div class="col-md-6">
        <h2>Active Users</h2>
        <table class="table table-striped">
          <thead><tr><th>Email</th><th>Last Active</th></tr></thead>
          <tbody id="active-users-table"></tbody>
        </table>
      </div>
      <div class="col-md-6">
        <h2>Passive Users</h2>
        <table class="table table-striped">
          <thead><tr><th>Email</th><th>Last Active</th></tr></thead>
          <tbody id="passive-users-table"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Linked navigation -->
  <div class="bottom-nav">
    <a href="/admin-panel/carbinate.html"><i class="fas fa-house"></i>Home</a>
    <a href="/admin-panel/users.html"><i class="fas fa-users"></i>Users</a>
    <a href="/admin-panel/withdrawals.html"><i class="fas fa-wallet"></i>Withdrawals</a>
    <a href="/admin-panel/past.html"><i class="fas fa-clock-rotate-left"></i>History</a>
    <a href="/admin-panel/charts.html" class="active"><i class="fas fa-chart-line"></i>Charts</a>
    <a href="/admin-panel/messages.html"><i class="fas fa-envelope"></i>Messages</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <script>
    function checkAuth() {
      const token = localStorage.getItem('adminToken');
      if (!token) {
        location.href = '/admin-panel/verify.html';
        return false;
      }
      return true;
    }

    async function loadCharts() {
      const token = localStorage.getItem('adminToken');
      const headers = {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      };

      try {
        // Earnings chart
        const earningsRes = await fetch('/api/admin/chart/earnings', {headers, credentials:'include'});
        if (earningsRes.ok) {
          const eData = await earningsRes.json();
          new Chart(document.getElementById('earningsChart'),{
            type:'bar',
            data:{labels:eData.labels,datasets:[{label:'Earnings ($)',data:eData.data,backgroundColor:'rgba(76,175,80,0.2)',borderColor:'rgba(76,175,80,1)',borderWidth:2}]},
            options:{scales:{y:{beginAtZero:true}}}
          });
        }

        // Ads watched chart
        const adsRes = await fetch('/api/admin/chart/ads-watched', {headers, credentials:'include'});
        if (adsRes.ok) {
          const aData = await adsRes.json();
          new Chart(document.getElementById('adsWatchedChart'),{
            type:'bar',
            data:{labels:aData.labels,datasets:[{label:'Ads Watched',data:aData.data,backgroundColor:'rgba(33,150,243,0.2)',borderColor:'rgba(33,150,243,1)',borderWidth:2}]},
            options:{scales:{y:{beginAtZero:true}}}
          });
        }

        // Earnings summary
        const summaryRes = await fetch('/api/admin/chart/earnings-summary', {headers, credentials:'include'});
        if (summaryRes.ok) {
          const sData = await summaryRes.json();
          document.getElementById('earnings-1-day').innerText = sData['1-day'] || '$0';
          document.getElementById('earnings-7-days').innerText = sData['7-days'] || '$0';
          document.getElementById('earnings-30-days').innerText = sData['30-days'] || '$0';
          document.getElementById('earnings-90-days').innerText = sData['90-days'] || '$0';
        }
      } catch(err) {
        console.error('Charts load error:', err);
      }
    }

    if (checkAuth()) {
      loadCharts();
    }
  </script>
</body>
</html>
