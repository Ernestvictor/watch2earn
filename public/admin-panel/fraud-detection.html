<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fraud Detection Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0b0c0f;
      --panel: #111827;
      --soft-panel: #1f2937;
      --muted: #9ca3af;
      --primary: #3b82f6;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f3f4f6;
      --border: rgba(255,255,255,0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 26px;
      background: rgba(17, 24, 39, 0.95);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(10px);
    }

    .brand {
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #7dd3fc;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
    }

    .pill {
      padding: 8px 12px;
      background: rgba(59,130,246,0.12);
      border: 1px solid rgba(59,130,246,0.4);
      border-radius: 999px;
      color: #bfdbfe;
      font-size: 12px;
      font-weight: 700;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 18px 80px;
    }

    h1, h2, h3 { margin: 0 0 16px; }

    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .metric {
      background: linear-gradient(180deg, rgba(31,41,55,0.9), rgba(17,24,39,0.8));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
    }

    .metric small {
      display: block;
      color: var(--muted);
      margin-bottom: 10px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .metric strong {
      font-size: 1.9rem;
      color: var(--text);
    }

    .metric.primary strong { color: #93c5fd; }
    .metric.success strong { color: #86efac; }
    .metric.warning strong { color: #fcd34d; }
    .metric.danger strong { color: #fca5a5; }

    .panel {
      background: rgba(17,24,39,0.9);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 24px;
    }

    .chart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }

    .chart-card {
      background: #0f172a;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      min-height: 270px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }

    .controls select, .controls input, .controls button {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #111827;
      color: var(--text);
    }

    .controls button {
      cursor: pointer;
      background: linear-gradient(135deg, var(--primary), #2563eb);
      border: none;
      font-weight: 700;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 12px;
    }

    th, td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    th {
      color: #bfdbfe;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    tbody tr:hover {
      background: rgba(255,255,255,0.02);
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .badge.high { background: rgba(239,68,68,0.18); color: #fca5a5; }
    .badge.medium { background: rgba(245,158,11,0.18); color: #fcd34d; }
    .badge.low { background: rgba(34,197,94,0.18); color: #86efac; }

    .badge.pending { background: rgba(245,158,11,0.16); color: #fcd34d; }
    .badge.reviewing { background: rgba(59,130,246,0.18); color: #bfdbfe; }
    .badge.blocked { background: rgba(239,68,68,0.18); color: #fca5a5; }
    .badge.cleared { background: rgba(34,197,94,0.18); color: #86efac; }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
      color: white;
    }

    .btn.approve { background: var(--success); }
    .btn.reject { background: var(--danger); }
    .btn.review { background: var(--primary); }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: space-around;
      background: rgba(17,24,39,0.95);
      border-top: 1px solid var(--border);
      padding: 10px 0;
      backdrop-filter: blur(10px);
    }

    .bottom-nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .bottom-nav a.active { color: #7dd3fc; }

    @media (max-width: 640px) {
      .topbar { padding: 12px 14px; }
      .header-actions { gap: 6px; }
      .brand { font-size: 14px; }
      .metrics { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><i class="fas fa-shield-alt"></i> Fraud Detection</div>
    <div class="header-actions">
      <span class="pill">Live Monitor</span>
      <span><i class="fas fa-circle" style="color:#22c55e; font-size:10px;"></i> Active</span>
    </div>
  </header>

  <main class="container">
    <h1>Admin Security Overview</h1>

    <section class="metrics">
      <div class="metric primary">
        <small>Risk Alerts</small>
        <strong>42</strong>
      </div>
      <div class="metric warning">
        <small>Pending Review</small>
        <strong>18</strong>
      </div>
      <div class="metric success">
        <small>Cleared</small>
        <strong>24</strong>
      </div>
      <div class="metric danger">
        <small>Blocked</small>
        <strong>9</strong>
      </div>
    </section>

    <section class="panel">
      <h2>Risk Analytics</h2>
      <div class="chart-grid">
        <div class="chart-card"><canvas id="riskChart"></canvas></div>
        <div class="chart-card"><canvas id="typeChart"></canvas></div>
        <div class="chart-card"><canvas id="dailyChart"></canvas></div>
      </div>
    </section>

    <section class="panel">
      <h2>Approval & Rejection Queue</h2>
      <div class="controls">
        <select id="statusFilter">
          <option value="all">All statuses</option>
          <option value="pending">Pending</option>
          <option value="reviewing">Reviewing</option>
          <option value="blocked">Blocked</option>
          <option value="cleared">Cleared</option>
        </select>
        <select id="riskFilter">
          <option value="all">All risk levels</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
        <input id="searchInput" type="text" placeholder="Search email or user ID" />
        <button>Refresh</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>User</th>
            <th>Type</th>
            <th>Risk</th>
            <th>Status</th>
            <th>Detected</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="fraudTableBody"></tbody>
      </table>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="/admin-panel/carbinate.html"><i class="fas fa-house"></i>Home</a>
    <a href="/admin-panel/approvals.html"><i class="fas fa-check-circle"></i>Approvals</a>
    <a href="/admin-panel/fraud-detection.html" class="active"><i class="fas fa-shield-alt"></i>Fraud</a>
    <a href="/admin-panel/charts.html"><i class="fas fa-chart-line"></i>Charts</a>
    <a href="/admin-panel/promoted.html" style="color:#4CAF50;text-decoration:none;font-size:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px"><i class="fas fa-crown"></i>Promoted</a>
  </nav>

  <script>
    let alerts = [];

    async function loadFraudAlerts() {
      try {
        const res = await fetch('/api/admin/inbox');
        if (!res.ok) throw new Error('Failed to fetch');
        const data = await res.json();

        // Map inbox alerts into the small alerts shape expected by the UI
        alerts = (data && data.alerts ? data.alerts : []).map((a, i) => ({
          user: a.email || (a.from || 'Unknown'),
          id: a.id || a.userId || ('A-' + (i+1)),
          type: a.type || a.subject || 'Alert',
          risk: a.risk || (a.severity || 'medium'),
          status: a.status || 'pending',
          date: a.createdAt ? new Date(a.createdAt).toLocaleDateString() : (a.date || '')
        }));

        renderTable();
      } catch (e) {
        console.warn('Failed to load fraud alerts', e);
        // leave alerts as-is; show empty state
        alerts = [];
        renderTable();
      }
    }

    function renderTable() {
      const statusFilter = document.getElementById('statusFilter').value;
      const riskFilter = document.getElementById('riskFilter').value;
      const search = document.getElementById('searchInput').value.trim().toLowerCase();

      const filtered = alerts.filter(item => {
        const matchesStatus = statusFilter === 'all' || item.status === statusFilter;
        const matchesRisk = riskFilter === 'all' || item.risk === riskFilter;
        const matchesSearch = !search || (item.user || '').toLowerCase().includes(search) || (item.id || '').toLowerCase().includes(search);
        return matchesStatus && matchesRisk && matchesSearch;
      });

      const body = document.getElementById('fraudTableBody');
      if (!filtered || filtered.length === 0) {
        body.innerHTML = '<tr><td colspan="6" class="empty"><i class="fas fa-inbox"></i> No alerts</td></tr>';
        return;
      }

      body.innerHTML = filtered.map(item => `
        <tr>
          <td>
            <strong>${item.user}</strong><br/>
            <small style="color: var(--muted);">${item.id}</small>
          </td>
          <td>${item.type}</td>
          <td><span class="badge ${item.risk}">${(item.risk||'').toString().toUpperCase()}</span></td>
          <td><span class="badge ${item.status}">${item.status}</span></td>
          <td>${item.date}</td>
          <td>
            <div class="actions">
              <button class="btn approve" onclick="approveAlert('${item.id}')">Approve</button>
              <button class="btn reject" onclick="rejectAlert('${item.id}')">Reject</button>
              <button class="btn review" onclick="reviewAlert('${item.id}')">Review</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    async function updateAlertStatus(id, status) {
      try {
        // Attempt to call an admin endpoint to update message status if exists
        await fetch('/api/admin/inbox/update-status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, status })
        }).catch(()=>{});
      } catch(e){}

      const item = alerts.find(a => a.id === id);
      if (item) item.status = status;
      renderTable();
    }

    function approveAlert(id) { updateAlertStatus(id, 'cleared'); }
    function rejectAlert(id) { updateAlertStatus(id, 'blocked'); }
    function reviewAlert(id) { updateAlertStatus(id, 'reviewing'); }

    document.getElementById('statusFilter').addEventListener('change', renderTable);
    document.getElementById('riskFilter').addEventListener('change', renderTable);
    document.getElementById('searchInput').addEventListener('input', renderTable);

    // Charts can stay static or be wired to endpoints; leave as-is for now
    new Chart(document.getElementById('riskChart'), {
      type: 'doughnut',
      data: {
        labels: ['Low', 'Medium', 'High', 'Critical'],
        datasets: [{ data: [25, 30, 28, 17], backgroundColor: ['#22c55e', '#f59e0b', '#f97316', '#ef4444'] }]
      }, options: { plugins: { legend: { position: 'bottom' } } }
    });

    new Chart(document.getElementById('typeChart'), {
      type: 'bar',
      data: { labels: ['Login', 'Earning', 'Referral', 'Withdrawal', 'Geography'], datasets: [{ label: 'Alerts', data: [14, 18, 11, 16, 9], backgroundColor: '#3b82f6' }] },
      options: { scales: { y: { beginAtZero: true } } }
    });

    new Chart(document.getElementById('dailyChart'), {
      type: 'line',
      data: { labels: ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], datasets: [{ label: 'Detected Cases', data: [6,10,8,14,12,17,13], borderColor: '#7dd3fc', backgroundColor: 'rgba(125,211,252,0.2)', fill: true, tension: 0.3 }] },
      options: { scales: { y: { beginAtZero: true } } }
    });

    // initial load
    loadFraudAlerts();
    setInterval(loadFraudAlerts, 15000);
  </script>
</body>
</html>
