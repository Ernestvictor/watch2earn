<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login - Watch2Earn</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background:#0f0f0f; color:#fff; font-family:Segoe UI,Arial,sans-serif;
      display:flex; justify-content:center; align-items:center; height:100vh;
    }
    .login-box {
      background:#111; border:1px solid #222; border-radius:12px;
      padding:24px; width:320px; text-align:center;
    }
    h2 { margin-bottom:20px; color:#4CAF50; }
    input {
      width:100%; padding:12px; margin:8px 0;
      border-radius:8px; border:1px solid #333; background:#1a1a1a; color:#fff;
    }
    button {
      width:100%; padding:12px; margin-top:12px;
      border:none; border-radius:8px; background:#4CAF50; color:#fff;
      font-weight:700; cursor:pointer;
    }
    #errorBox { color:#ff6b6b; margin-top:10px; display:none; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2><i class="fas fa-lock"></i> Admin Login</h2>
    <input id="email" placeholder="Email"/>
    <input id="pass" type="password" placeholder="Password"/>
    <button onclick="login()">Login</button>
    <div id="errorBox"></div>
  </div>

  <script>
    async function login(){
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('pass').value.trim();
      document.getElementById('errorBox').style.display='none';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ email, password: pass })
        });
        const data = await res.json();
        if(res.ok){
          localStorage.setItem('admin_token', data.token);
          location.href = '/admin-dashboard.html'; // redirect to admin panel
        } else {
          document.getElementById('errorBox').innerText = data.error || 'Login failed';
          document.getElementById('errorBox').style.display='block';
        }
      } catch(e){
        document.getElementById('errorBox').innerText = 'Server error: '+e.message;
        document.getElementById('errorBox').style.display='block';
      }
    }
  </script>
</body>
</html>
