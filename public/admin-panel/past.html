<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>History</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0b0c0f;color:#e0e0e0;font-family:'Segoe UI',Inter,Arial,sans-serif;padding-bottom:90px}
    .top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:#121214;border-bottom:1px solid #232326;position:sticky;top:0;z-index:10}
    .logo{font-weight:900;font-size:20px;color:#4CAF50}
    .container{max-width:1200px;margin:0 auto;padding:16px}
    h2{margin-bottom:16px;color:#4CAF50}
    .stats{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}
    .stat{flex:1;min-width:200px;background:#1a1a1d;border:1px solid #232326;border-radius:16px;padding:16px;text-align:center}
    .stat b{display:block;font-size:22px;color:#4CAF50}
    table{width:100%;border-collapse:collapse;margin-top:20px}
    th,td{padding:12px;border-bottom:1px solid #232326;text-align:left}
    th{background:#1a1a1d;color:#4CAF50}
    tr:hover{background:#1f2023}
    input,select,button{margin:6px;padding:8px;border-radius:6px;border:none}
    button{cursor:pointer}
    button.export{background:#2196F3;color:#fff}
    button.view{background:#4CAF50;color:#fff}
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#121214;border-top:1px solid #232326;display:flex;justify-content:space-around;padding:10px 0;z-index:20}
    .bottom-nav a{color:#888;text-decoration:none;font-size:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
    .bottom-nav a.active{color:#4CAF50;font-weight:700}
  </style>
</head>
<body>
  <div class="top"><div class="logo">History</div><div style="display:flex;align-items:center;gap:12px"><a href="/admin-panel/inbox.html" style="display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:#18181b;border:1px solid #2f2f32;color:#fff;text-decoration:none" title="Inbox"><i class="fas fa-inbox"></i></a></div></div>
  <div class="container">
    <h2>History</h2>
    <div class="stats">
      <div class="stat">
        <small>Total Paid Out</small>
        <b id="totalPaid">$0</b>
      </div>
      <div class="stat">
        <small>Paid This Month</small>
        <b id="paidMonth">$0</b>
      </div>
    </div>

    <h3>Filters & Search</h3>
    <input type="text" id="searchInput" placeholder="Search by User ID, Email, Transaction ID">
    <select id="dateRange">
      <option value="all">All</option>
      <option value="today">Today</option>
      <option value="7days">Last 7 days</option>
      <option value="30days">Last 30 days</option>
      <option value="custom">Custom</option>
    </select>
    <button class="export" onclick="exportData('csv')">Export CSV</button>
    <button class="export" onclick="exportData('pdf')">Export PDF</button>

    <h3>Transaction History</h3>
    <table id="historyTable">
      <thead>
        <tr><th>Date</th><th>Txn ID</th><th>User</th><th>Amount</th><th>Method</th><th>Status</th><th>Fee</th><th>Net Paid</th><th>Proof</th></tr>
      </thead>
      <tbody></tbody>
    </table>

    <h3>System Updates</h3>
    <table id="updatesTable">
      <thead>
        <tr><th>Date</th><th>Update Type</th><th>Description</th></tr>
      </thead>
      <tbody></tbody>
    </table>

    <h3>Analytics Charts</h3>
    <canvas id="payoutsOverTimeChart"></canvas>
    <canvas id="methodBreakdownChart"></canvas>
  </div>

  <div class="bottom-nav">
    <a href="/admin-panel/carbinate.html"><i class="fas fa-house"></i>Home</a>
    <a href="/admin-panel/users.html"><i class="fas fa-users"></i>Users</a>
    <a href="/admin-panel/withdrawals.html"><i class="fas fa-wallet"></i>Withdrawals</a>
    <a href="/admin-panel/past.html" class="active"><i class="fas fa-clock-rotate-left"></i>History</a>
    <a href="/admin-panel/charts.html"><i class="fas fa-chart-line"></i>Charts</a>
    <a href="/admin-panel/messages.html"><i class="fas fa-envelope"></i>Messages</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    function checkAuth() {
      const token = localStorage.getItem('adminToken');
      if (!token) {
        location.href = '/admin-panel/verify.html';
        return false;
      }
      return true;
    }

    async function loadHistory() {
      try {
        const token = localStorage.getItem('adminToken');
        const res = await fetch('/api/admin/history', {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          credentials: 'include'
        });
        
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const history = await res.json();
        
        // Calculate statistics
        let totalPaid = 0;
        let paidThisMonth = 0;
        const now = new Date();
        const thisMonth = new Date(now.getFullYear(), now.getMonth(), 1);
        
        history.forEach(h => {
          const amount = Number(h.amount || h.amountUsd || 0);
          totalPaid += amount;
          
          if (h.status === 'approved' || (h.type && h.type.includes('withdrawal'))) {
            if (new Date(h.createdAt || h.date || Date.now()) >= thisMonth) {
              paidThisMonth += amount;
            }
          }
        });
        
        document.getElementById('totalPaid').textContent = `$${totalPaid.toFixed(2)}`;
        document.getElementById('paidMonth').textContent = `$${paidThisMonth.toFixed(2)}`;
        
        // Populate history table
        const tbody = document.querySelector('#historyTable tbody');
        if (!history.length) {
          tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#888;">No history yet</td></tr>';
          return;
        }
        
        tbody.innerHTML = history.slice(0, 100).map(h => {
          const date = new Date(h.createdAt || h.date || Date.now());
          return `
            <tr>
              <td>${date.toLocaleDateString()}</td>
              <td>${h.id || h._id || 'N/A'}</td>
              <td>${h.userId || h.firebaseUid || 'N/A'}</td>
              <td>$${Number(h.amount || h.amountUsd || 0).toFixed(2)}</td>
              <td>${h.type || 'earning'}</td>
              <td><span style="color:#4CAF50">${h.status || 'completed'}</span></td>
              <td>$0.00</td>
              <td>$${Number(h.amount || h.amountUsd || 0).toFixed(2)}</td>
              <td><button style="padding:4px 8px;background:#2196F3;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:11px">View</button></td>
            </tr>
          `;
        }).join('');
      } catch(err) {
        console.error('History load error:', err);
        document.querySelector('#historyTable tbody').innerHTML = `<tr><td colspan="9" style="color:#f44336;text-align:center;">Error loading history: ${err.message}</td></tr>`;
      }
    }

    function exportData(format) {
      alert(`Export as ${format.toUpperCase()} - Feature coming soon`);
    }

    if (checkAuth()) {
      loadHistory();
      setInterval(loadHistory, 30000); // Reload every 30 seconds
    }
  </script>
</body>
</html>
