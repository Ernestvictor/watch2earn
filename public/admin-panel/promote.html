<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Promote User</title>
  <link rel="stylesheet" href="admin.css">
  <style>
    body{background:#0b0c0f;color:#e0e0e0;font-family:'Segoe UI',Arial,sans-serif}
    .container{max-width:760px;margin:24px auto;padding:16px}
    .card{background:#1a1a1d;border:1px solid #232326;border-radius:12px;padding:20px}
    input,button{padding:10px;border-radius:8px;border:none}
    input{width:100%;margin-bottom:12px}
    button{background:#4CAF50;color:#fff;font-weight:700}
  </style>
</head>
<body>
  <div style="background:#121214;border-bottom:1px solid #232326;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10">
    <div style="font-weight:900;font-size:20px;color:#4CAF50">Promote User</div>
    <a href="inbox.html" style="display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:#18181b;border:1px solid #2f2f32;color:#fff;text-decoration:none" title="Inbox"><i class="fas fa-inbox"></i></a>
  </div>
  <div class="container">
    <div class="card">
      <h2>Promote User</h2>
      <p>Enter the user ID or email to promote. The user will receive a verification code via email.</p>
      <input id="ident" placeholder="User ID or email">
      <div style="display:flex;gap:8px">
        <button id="btnPromote">Promote</button>
        <button id="btnCancel" onclick="history.back()" type="button">Cancel</button>
      </div>
      <div id="msg" style="margin-top:12px;color:#bbb;"></div>
    </div>
  </div>
  <script>
    document.getElementById('btnPromote').addEventListener('click', async ()=>{
      const ident = document.getElementById('ident').value.trim();
      if(!ident) return document.getElementById('msg').innerText = 'Enter id or email';
      const token = localStorage.getItem('adminToken');
      if(!token) return document.getElementById('msg').innerText = 'Login required';
      
      const msgEl = document.getElementById('msg');
      msgEl.innerText = 'Processing...';
      msgEl.style.color = '#4CAF50';
      
      try{
        const res = await fetch(`/api/admin/users/${encodeURIComponent(ident)}`,{ 
          method:'PUT', 
          headers: { 
            'Content-Type':'application/json', 
            'Authorization': `Bearer ${token}` 
          }, 
          body: JSON.stringify({ action: 'promote' }) 
        });
        
        if(!res.ok) {
          const err = await res.json().catch(()=>({}));
          throw new Error(err.error || 'HTTP '+res.status);
        }
        
        const data = await res.json();
        msgEl.innerText = data.message || 'User promoted successfully. Verification code sent via email.';
        msgEl.style.color = '#4CAF50';
        setTimeout(() => { window.location.href = 'users.html'; }, 2000);
      }catch(e){ 
        msgEl.innerText = 'Failed to promote: '+(e.message||e); 
        msgEl.style.color = '#f44336';
      }
    });
  </script>
</body>
</html>
