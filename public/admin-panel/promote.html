<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Promote User</title>
  <link rel="stylesheet" href="admin.css">
  <style>
    body{background:#0b0c0f;color:#e0e0e0;font-family:'Segoe UI',Arial,sans-serif}
    .container{max-width:760px;margin:24px auto;padding:16px}
    .card{background:#1a1a1d;border:1px solid #232326;border-radius:12px;padding:20px}
    input,button{padding:10px;border-radius:8px;border:none}
    input{width:100%;margin-bottom:12px}
    button{background:#4CAF50;color:#fff;font-weight:700}
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2>Promote User</h2>
      <p>Enter the user ID or email to promote. This will mark the user as promoted and make <strong>verifild.html</strong> visible to them.</p>
      <input id="ident" placeholder="User ID or email">
      <div style="display:flex;gap:8px">
        <button id="btnPromote">Promote</button>
        <button id="btnCancel" onclick="history.back()" type="button">Cancel</button>
      </div>
      <div id="msg" style="margin-top:12px;color:#bbb"></div>
    </div>
  </div>
  <script>
    document.getElementById('btnPromote').addEventListener('click', async ()=>{
      const id = document.getElementById('ident').value.trim();
      if(!id) return document.getElementById('msg').innerText = 'Enter id or email';
      const token = localStorage.getItem('adminToken');
      try{
        const res = await fetch(`/api/admin/users/${encodeURIComponent(id)}`,{ method:'PUT', headers: { 'Content-Type':'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ action: 'promote' }) });
        if(!res.ok) throw new Error('HTTP '+res.status);
        document.getElementById('msg').innerText = 'User promoted successfully.';
      }catch(e){ document.getElementById('msg').innerText = 'Failed to promote: '+(e.message||e); }
    });
  </script>
</body>
</html>
