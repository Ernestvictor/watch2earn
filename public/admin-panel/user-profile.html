<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - Admin Panel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *{box-sizing:border-box} body{margin:0;background:#0b0c0f;color:#edf2f7;font-family:'Segoe UI',Arial,sans-serif;padding-bottom:90px}
    .top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:#121214;border-bottom:1px solid #232326;position:sticky;top:0;z-index:10}
    .logo{font-weight:900;font-size:20px;color:#4CAF50}
    .top-actions{display:flex;align-items:center;gap:12px}
    .inbox-link{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:#18181b;border:1px solid #2f2f32;color:#fff;text-decoration:none}
    .container{max-width:1100px;margin:0 auto;padding:18px}
    .profile-header{background:linear-gradient(135deg,#163216,#0d1f0d);border:1px solid #17341a;border-radius:18px;padding:20px;margin-bottom:14px}
    .profile-header h2{margin:0 0 8px;color:#4CAF50}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:16px}
    .stat{background:#1a1a1d;border:1px solid #2b2b2d;border-radius:16px;padding:16px;text-align:center}
    .stat .label{display:block;color:#9aa3ad;font-size:12px;margin-bottom:6px}
    .stat .value{display:block;color:#fff;font-size:28px;font-weight:800}
    .card{background:#1a1a1d;border:1px solid #2b2b2d;border-radius:16px;padding:16px;margin-bottom:16px}
    table{width:100%;border-collapse:collapse}
    th,td{padding:12px;border-bottom:1px solid #232326;text-align:left}
    th{background:#1a1a1d;color:#4CAF50}
    tr:hover{background:#1d1d20}
    .badge{display:inline-block;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:700}
    .ad{background:#14361a;color:#7fe39b}.bonus{background:#332a16;color:#f9b74a}.referral{background:#122d4b;color:#8ec9ff}.survey{background:#3a1b2a;color:#ff8ab2}.strike{background:#2d3e14;color:#cfe366}.game{background:#2f1d1d;color:#ffb4b4}.telegram{background:#1d2b3a;color:#8dd3ff}.other{background:#2d2d31;color:#dfe6ec}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .btn{padding:10px 14px;border:none;border-radius:8px;color:#fff;cursor:pointer;font-weight:700}
    .suspend{background:#ff9800}.ban{background:#f44336}.restore{background:#4CAF50}
    .empty{text-align:center;padding:30px;color:#7b7b7b}
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#121214;border-top:1px solid #232326;display:flex;justify-content:space-around;padding:10px 0;z-index:20}
    .bottom-nav a{color:#888;text-decoration:none;font-size:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
    .bottom-nav a.active{color:#4CAF50;font-weight:700}
    @media (max-width:600px){table,thead,tbody,tr,td,th{display:block;} thead{display:none;} tr{margin-bottom:12px;background:#141416;border:1px solid #232326;border-radius:12px;padding:8px;} td{border:none;padding:8px 0;}} 
  </style>
</head>
<body>
  <div class="top">
    <div class="logo">User Profile</div>
    <div class="top-actions">
      <a href="/admin-panel/inbox.html" class="inbox-link" title="Inbox"><i class="fas fa-inbox"></i></a>
    </div>
  </div>

  <div class="container">
    <div class="profile-header" id="profileHeader">
      <h2>Loading user...</h2>
      <p style="color:#d0d5db;margin:0">Fetching earning and status information...</p>
    </div>

    <div class="card">
      <div class="toolbar">
        <button class="btn suspend" id="suspendBtn">Suspend</button>
        <button class="btn ban" id="banBtn">Ban</button>
        <button class="btn restore" id="restoreBtn">Remove Suspend/Ban</button>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top:0">Current Earning Summary</h3>
      <div class="stats" id="summaryStats"></div>
    </div>

    <div class="card">
      <h3 style="margin-top:0">Earning History</h3>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr><th>Date</th><th>Time</th><th>Type</th><th>Description</th><th>Amount</th></tr>
          </thead>
          <tbody id="historyTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="/admin-panel/carbinate.html"><i class="fas fa-house"></i>Home</a>
    <a href="/admin-panel/users.html" class="active"><i class="fas fa-users"></i>Users</a>
    <a href="/admin-panel/leaderboard.html"><i class="fas fa-trophy"></i>Leaderboard</a>
    <a href="/admin-panel/messages.html"><i class="fas fa-envelope"></i>Messages</a>
  </div>

  <script>
    const userId = new URLSearchParams(location.search).get('id');
    const tableBody = document.getElementById('historyTable');
    const summaryStats = document.getElementById('summaryStats');
    const profileHeader = document.getElementById('profileHeader');

    function badgeClass(type) {
      const key = (type || 'other').toLowerCase();
      if (key.includes('ad')) return 'ad';
      if (key.includes('bonus') || key.includes('strike')) return 'bonus';
      if (key.includes('referral') || key.includes('commission')) return 'referral';
      if (key.includes('survey')) return 'survey';
      if (key.includes('game')) return 'game';
      if (key.includes('telegram')) return 'telegram';
      return 'other';
    }

    function formatMoney(value) { return `₦${Number(value || 0).toLocaleString(undefined, {maximumFractionDigits:2})}`; }

    function formatDateTime(dateString) {
      const d = new Date(dateString || Date.now());
      if (Number.isNaN(d.getTime())) return 'N/A';
      return `${d.toLocaleDateString()} ${d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})}`;
    }

    async function loadProfile() {
      if (!userId) {
        profileHeader.innerHTML = '<h2>No user selected</h2><p style="color:#d0d5db;margin:0">Use the users list to open a profile.</p>';
        return;
      }

      try {
        const token = localStorage.getItem('adminToken');
        const res = await fetch(`/api/admin/user/${encodeURIComponent(userId)}`, { headers: { Authorization: `Bearer ${token}` } });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const transactions = data.transactions || [];
        const summary = data.summary || { total:0, ads:0, referrals:0, bonus:0, game:0, survey:0, telegram:0 };

        profileHeader.innerHTML = `
          <h2>${data.name || 'User'}</h2>
          <p style="margin:4px 0;color:#d0d5db"><strong>Email:</strong> ${data.email || 'N/A'}</p>
          <p style="margin:4px 0;color:#d0d5db"><strong>Status:</strong> <span style="color:${data.status==='banned'?'#ff8a80':data.status==='suspended'?'#ffca28':'#81e6d9'};font-weight:700">${data.status || 'active'}</span></p>
        `;

        summaryStats.innerHTML = `
          <div class="stat"><span class="label">Total Earnings</span><span class="value">${formatMoney(summary.total)}</span></div>
          <div class="stat"><span class="label">Ads</span><span class="value">${formatMoney(summary.ads)}</span></div>
          <div class="stat"><span class="label">Referral Bonus</span><span class="value">${formatMoney(summary.referrals)}</span></div>
          <div class="stat"><span class="label">Bonus</span><span class="value">${formatMoney(summary.bonus)}</span></div>
          <div class="stat"><span class="label">Game</span><span class="value">${formatMoney(summary.game)}</span></div>
          <div class="stat"><span class="label">Survey</span><span class="value">${formatMoney(summary.survey)}</span></div>
          <div class="stat"><span class="label">Daily Strike</span><span class="value">${formatMoney(summary.dailystrike)}</span></div>
          <div class="stat"><span class="label">Telegram</span><span class="value">${formatMoney(summary.telegram)}</span></div>
        `;

        if (!transactions.length) {
          tableBody.innerHTML = '<tr><td colspan="5" class="empty">No earnings found yet</td></tr>';
        } else {
          tableBody.innerHTML = transactions.map((tx) => {
            const type = String(tx.type || 'other');
            const amount = Number(tx.amountUsd || tx.amount || 0);
            return `
              <tr>
                <td>${formatDateTime(tx.date || tx.createdAt)}</td>
                <td>${new Date(tx.date || tx.createdAt || Date.now()).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})}</td>
                <td><span class="badge ${badgeClass(type)}">${type.replace(/_/g, ' ').toUpperCase()}</span></td>
                <td>${tx.title || tx.description || 'Activity'}</td>
                <td>${formatMoney(amount)}</td>
              </tr>
            `;
          }).join('');
        }

        // Render referrals (count + list)
        const referrals = data.referrals || [];
        let refCard = document.getElementById('referralsCard');
        if (!refCard) {
          const container = document.querySelector('.container');
          const card = document.createElement('div');
          card.className = 'card';
          card.id = 'referralsCard';
          card.innerHTML = `
            <h3 style="margin-top:0">Referrals (${referrals.length})</h3>
            <div style="overflow-x:auto">
              <table>
                <thead><tr><th>#</th><th>Referred Email / UID</th><th>Commission</th><th>Date</th><th>Status</th></tr></thead>
                <tbody id="referralsTable"></tbody>
              </table>
            </div>
          `;
          container.appendChild(card);
          refCard = card;
        }

        const refTBody = document.getElementById('referralsTable');
        if (!referrals || referrals.length === 0) {
          refTBody.innerHTML = '<tr><td colspan="5" class="empty">No referrals found for this user</td></tr>';
        } else {
          refTBody.innerHTML = referrals.map((r, i) => `<tr><td>${i+1}</td><td>${r.referredEmail || r.referredUid || 'N/A'}</td><td>${formatMoney(r.commission)}</td><td>${formatDateTime(r.createdAt)}</td><td>${r.status || ''}</td></tr>`).join('');
        }
      } catch (error) {
        console.error(error);
        profileHeader.innerHTML = '<h2>Error</h2><p style="color:#d0d5db;margin:0">Could not load user profile.</p>';
      }
    }

    async function setUserStatus(action) {
      const token = localStorage.getItem('adminToken');
      const res = await fetch(`/api/admin/users/${encodeURIComponent(userId)}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ action, reason: `Admin action: ${action}` })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        alert(data.error || 'Action failed');
        return;
      }
      alert(`${action} applied successfully`);
      loadProfile();
    }

    document.getElementById('suspendBtn').addEventListener('click', () => setUserStatus('suspend'));
    document.getElementById('banBtn').addEventListener('click', () => setUserStatus('ban'));
    document.getElementById('restoreBtn').addEventListener('click', () => {
      showConfirmModal('Remove Ban/Suspend from this user?', async () => {
        try {
          const token = localStorage.getItem('adminToken');
          const res = await fetch(`/api/admin/users/${encodeURIComponent(userId)}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ action: 'unban' })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            alert(data.error || 'Action failed');
            return;
          }
          alert('User restored successfully');
          loadProfile();
        } catch (err) {
          alert('Error: ' + (err && err.message));
        }
      });
    });

    loadProfile();
  </script>

  <!-- Confirm modal -->
  <div id="confirmModal" style="display:none;position:fixed;inset:0;background:rgba(3,6,8,0.6);z-index:9999;align-items:center;justify-content:center">
    <div style="background:#0f1113;color:#fff;padding:20px;border-radius:10px;max-width:480px;margin:auto;border:1px solid #232326">
      <div id="confirmModalMessage" style="margin-bottom:16px">Are you sure?</div>
      <div style="text-align:right;display:flex;gap:8px;justify-content:flex-end">
        <button id="confirmModalCancel" style="background:#2b2b2d;color:#fff;padding:8px 12px;border-radius:8px;border:none">Cancel</button>
        <button id="confirmModalOk" style="background:#4CAF50;color:#fff;padding:8px 12px;border-radius:8px;border:none">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    // Reusable confirm modal for admin pages
    function showConfirmModal(message, onConfirm) {
      const modal = document.getElementById('confirmModal');
      const msg = document.getElementById('confirmModalMessage');
      const ok = document.getElementById('confirmModalOk');
      const cancel = document.getElementById('confirmModalCancel');
      msg.textContent = message || 'Are you sure?';
      modal.style.display = 'flex';
      function cleanup() {
        ok.removeEventListener('click', handleOk);
        cancel.removeEventListener('click', handleCancel);
        modal.style.display = 'none';
      }
      async function handleOk() { cleanup(); try { await onConfirm(); } catch(e){ console.error(e); } }
      function handleCancel() { cleanup(); }
      ok.addEventListener('click', handleOk);
      cancel.addEventListener('click', handleCancel);
    }
  </script>
</body>
</html>
