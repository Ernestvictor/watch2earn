<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Users</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0b0c0f;color:#e0e0e0;font-family:'Segoe UI',Inter,Arial,sans-serif;padding-bottom:90px}
    .top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:#121214;border-bottom:1px solid #232326;position:sticky;top:0;z-index:10}
    .logo{font-weight:900;font-size:20px;color:#4CAF50}
    .container{max-width:960px;margin:0 auto;padding:16px}
    h2{margin-bottom:16px}
    .stats{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}
    .stat{flex:1;min-width:200px;background:#1a1a1d;border:1px solid #232326;border-radius:16px;padding:16px;text-align:center}
    .stat b{display:block;font-size:22px;color:#4CAF50}
    table{width:100%;border-collapse:collapse;margin-top:20px}
    th,td{padding:12px;border-bottom:1px solid #232326;text-align:left}
    th{background:#1a1a1d;color:#4CAF50}
    tr:hover{background:#1f2023}
    button{padding:6px 12px;border:none;border-radius:6px;cursor:pointer;margin-right:6px}
    button.view{background:#2196F3;color:#fff}
    button.ban{background:#f44336;color:#fff}
    button.promote{background:#4CAF50;color:#fff}
    button.suspend{background:#f44336;color:#fff}
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#121214;border-top:1px solid #232326;display:flex;justify-content:space-around;padding:10px 0;z-index:20}
    .bottom-nav a{color:#888;text-decoration:none;font-size:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
    .bottom-nav a.active{color:#4CAF50;font-weight:700}
    /* Modal Styles */
    .modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:9998;justify-content:center;align-items:center}
    .modal-overlay.active{display:flex}
    .modal-box{background:#1a1a1d;border:1px solid #232326;border-radius:12px;padding:24px;max-width:400px;width:90%;box-shadow:0 8px 24px rgba(0,0,0,0.5)}
    .modal-box h3{color:#fff;margin-bottom:12px;font-size:18px}
    .modal-box p{color:#b0b0b0;margin-bottom:16px;font-size:14px}
    .modal-box input{width:100%;padding:10px;margin-bottom:12px;border:1px solid #232326;border-radius:6px;background:#121214;color:#fff}
    .modal-box input::placeholder{color:#666}
    .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
    .modal-actions button{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-weight:600}
    .modal-actions .btn-cancel{background:#333;color:#fff}
    .modal-actions .btn-confirm{background:#f44336;color:#fff}
    .modal-actions .btn-confirm:hover{background:#d32f2f}
    @media(max-width:600px){
      table,thead,tbody,tr,td,th{display:block}
      tr{margin-bottom:12px}
      td{padding:8px;border:none}
      th{display:none}
    }
  </style>
</head>
<body>
  <div class="top"><div class="logo">Users</div><div style="display:flex;align-items:center;gap:12px"><a href="/admin-panel/inbox.html" style="display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:#18181b;border:1px solid #2f2f32;color:#fff;text-decoration:none" title="Inbox"><i class="fas fa-inbox"></i></a></div></div>
  <div class="container">
    <h2>Users</h2>
    <div class="stats">
      <div class="stat">
        <small>Health Score</small>
        <b id="healthScore">0%</b>
        <small id="userBreakdown"></small>
      </div>
      <div class="stat">
        <small>Total Users</small>
        <b id="totalUsers">0</b>
        <small id="userGrowth"></small>
      </div>
    </div>
    <h3>User List</h3>
    <table id="usersTable">
      <thead>
        <tr><th>Name</th><th>Email</th><th>UID</th><th>Role</th><th>Status</th><th>Actions</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Confirmation Modal -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal-box">
      <h3 id="modalTitle">Confirm Action</h3>
      <p id="modalMessage"></p>
      <input type="text" id="modalReason" placeholder="Reason (optional)" style="display:none">
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-confirm" id="confirmBtn" onclick="submitModalAction()">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Ban Modal (uses same overlay system) -->
  <div class="modal-overlay" id="banModal" style="display:none">
    <div class="modal-box">
      <h3>Ban User</h3>
      <p>Are you sure you want to ban user <strong id="banUidDisplay"></strong>?</p>
      <input type="text" id="banReason" placeholder="Ban reason (optional)">
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeBanModal()">Cancel</button>
        <button class="btn-confirm" onclick="submitBan()">Ban User</button>
      </div>
    </div>
  </div>

  <!-- Unban Modal -->
  <div class="modal-overlay" id="unbanModal" style="display:none">
    <div class="modal-box">
      <h3>Enable User Account</h3>
      <p>Re-enable account for <strong id="unbanUidDisplay"></strong>?</p>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeUnbanModal()">Cancel</button>
        <button class="btn-confirm" onclick="submitUnban()">Enable Account</button>
      </div>
    </div>
  </div>
  <div class="bottom-nav">
    <a href="/admin-panel/carbinate.html"><i class="fas fa-house"></i>Home</a>
    <a href="/admin-panel/users.html" class="active"><i class="fas fa-users"></i>Users</a>
    <a href="/admin-panel/withdrawals.html"><i class="fas fa-wallet"></i>Withdrawals</a>
    <a href="/admin-panel/past.html"><i class="fas fa-clock-rotate-left"></i>History</a>
    <a href="/admin-panel/charts.html"><i class="fas fa-chart-line"></i>Charts</a>
    <a href="/admin-panel/messages.html"><i class="fas fa-envelope"></i>Messages</a>
  </div>
  <script>
    function checkAuth() {
      const token = localStorage.getItem('adminToken');
      if (!token) {
        location.href = '/admin-panel/verify.html';
        return false;
      }
      return true;
    }

    async function loadUsers() {
      try {
        const token = localStorage.getItem('adminToken');
        const res = await fetch('/api/admin/users', {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          credentials: 'include'
        });
        
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        
        document.getElementById('healthScore').textContent = `${data.healthScore || 0}%`;
        document.getElementById('userBreakdown').textContent = `Real: ${data.real || 0} | Bots: ${data.bots || 0}`;
        document.getElementById('totalUsers').textContent = data.total || 0;
        document.getElementById('userGrowth').textContent = `Today: ${data.today || 0} | Week: ${data.week || 0} | Month: ${data.month || 0}`;
        
        const tbody = document.querySelector('#usersTable tbody');
        if ((data.users || []).length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#888;">No users yet</td></tr>';
        } else {
          tbody.innerHTML = data.users.map(u=>{
            const name = u.displayName || u.username || (u.email ? u.email.split('@')[0] : 'Unknown');
            const email = u.email || 'N/A';
            const role = u.role || (u.promoted ? 'Verified' : 'User');
            const status = (u.isBanned ? 'Banned' : u.isSuspended ? 'Suspended' : u.status || 'Active');
            const userId = u.id || u._id || u.uid || u.firebaseUid || 'unknown';
            return `
            <tr>
              <td>${name}</td>
              <td>${email}</td>
              <td style="font-family:monospace">${userId}</td>
              <td>${role}</td>
              <td style="color:${status==='Banned'?'#ff8a80':status==='Suspended'?'#ffca28':'#81c784'};font-weight:600">${status}</td>
              <td>
                <button class="view" onclick="viewUser('${userId}')">View</button>
                <button class="ban" onclick="updateUser('${userId}','ban')">Ban</button>
                <button style="background:#ff9800;color:#fff" onclick="updateUser('${userId}','suspend')">Suspend</button>
                <button class="promote" onclick="updateUser('${userId}','promote')">Promote</button>
              </td>
            </tr>`;
          }).join('');
        }
      } catch(err) {
        console.error('Users load error:', err);
        document.querySelector('#usersTable tbody').innerHTML = `<tr><td colspan="5" style="color:#f44336;text-align:center;">Error loading users: ${err.message}</td></tr>`;
      }
    }

    function viewUser(id){
      // open admin user profile page in admin panel
      window.location.href = `/admin-panel/user-profile.html?id=${id}`;
    }

    async function updateUser(id, action){
      const token = localStorage.getItem('adminToken');
      if(!token) return alert('Admin login required');

      // For ban, open modal to collect reason
      if (action === 'ban') {
        openBanModal(id);
        return;
      }

      // For unban, open confirmation modal
      if (action === 'unban') {
        openUnbanModal(id);
        return;
      }

      showToast('Processing...', 'info');
      try {
        // Fallback for other admin actions (suspend, promote, etc.)
        const res = await fetch(`/api/admin/users/${encodeURIComponent(id)}`,{
          method:'PUT',
          headers:{
            'Content-Type':'application/json',
            'Authorization': `Bearer ${token}`
          },
          body:JSON.stringify({action})
        });
        const json = await res.json().catch(()=>({}));
        if(res.ok) {
          const actionText = action === 'suspend' ? 'Suspended' : action === 'promote' ? 'Promoted' : 'Updated';
          showToast(`User ${actionText}`, 'success');
          setTimeout(()=>location.reload(), 900);
        } else {
          showToast(json.error || 'Action failed', 'error');
        }
      } catch (e) { showToast('Request failed', 'error'); console.error(e); }
    }

    // --- Modal handling ---
    function openBanModal(uid){
      document.getElementById('banUidDisplay').innerText = uid;
      document.getElementById('banReason').value = '';
      document.getElementById('banModal').style.display = 'flex';
      document.getElementById('banModal').dataset.uid = uid;
    }
    
    function closeBanModal(){
      document.getElementById('banModal').style.display = 'none';
      delete document.getElementById('banModal').dataset.uid;
    }

    function openUnbanModal(uid){
      document.getElementById('unbanUidDisplay').innerText = uid;
      document.getElementById('unbanModal').style.display = 'flex';
      document.getElementById('unbanModal').dataset.uid = uid;
    }

    function closeUnbanModal(){
      document.getElementById('unbanModal').style.display = 'none';
      delete document.getElementById('unbanModal').dataset.uid;
    }

    async function submitBan(){
      const modal = document.getElementById('banModal');
      const uid = modal.dataset.uid;
      const reason = document.getElementById('banReason').value || 'Violation of rules';
      const adminEmail = localStorage.getItem('adminEmail') || null;
      const token = localStorage.getItem('adminToken');
      if(!uid) return alert('Missing user id');
      showToast('Banning user...', 'info');
      try{
        const res = await fetch('/api/admin/firebase/ban', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ uid, reason, adminEmail })
        });
        const json = await res.json().catch(()=>({}));
        if(!res.ok){ showToast(json.error || 'Ban failed', 'error'); return; }
        showToast('User banned', 'success');
        closeBanModal();
        setTimeout(()=>location.reload(),900);
      }catch(e){ console.error(e); showToast('Ban request failed', 'error'); }
    }

    async function submitUnban(){
      const modal = document.getElementById('unbanModal');
      const uid = modal.dataset.uid;
      const token = localStorage.getItem('adminToken');
      if(!uid) return alert('Missing user id');
      showToast('Enabling account...', 'info');
      try{
        const res = await fetch('/api/admin/firebase/unban', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ uid, adminEmail: localStorage.getItem('adminEmail') || null })
        });
        const json = await res.json().catch(()=>({}));
        if(!res.ok){ showToast(json.error || 'Action failed', 'error'); return; }
        showToast('User account enabled', 'success');
        closeUnbanModal();
        setTimeout(()=>location.reload(),900);
      }catch(e){ console.error(e); showToast('Request failed', 'error'); }
    }

    // Simple toast helper
    function showToast(msg, type='info'){
      let el = document.getElementById('admin-toast');
      if(!el){
        el = document.createElement('div'); el.id = 'admin-toast';
        el.style.position = 'fixed'; el.style.bottom = '20px'; el.style.right = '20px'; el.style.padding='10px 14px'; el.style.borderRadius='8px'; el.style.zIndex='9999'; el.style.color='#fff'; el.style.fontWeight='700';
        document.body.appendChild(el);
      }
      el.style.background = (type==='success')? '#4CAF50' : (type==='error')? '#f44336' : '#333';
      el.innerText = msg;
      el.style.display = 'block';
      setTimeout(()=>{ if(el) el.style.display='none'; }, 3000);
    }

    if (checkAuth()) {
      loadUsers();
    }
  </script>
</body>
</html>
