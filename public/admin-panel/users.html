<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Users</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0b0c0f;color:#e0e0e0;font-family:'Segoe UI',Inter,Arial,sans-serif;padding-bottom:90px}
    .top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:#121214;border-bottom:1px solid #232326;position:sticky;top:0;z-index:10}
    .logo{font-weight:900;font-size:20px;color:#4CAF50}
    .container{max-width:960px;margin:0 auto;padding:16px}
    h2{margin-bottom:16px}
    .stats{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}
    .stat{flex:1;min-width:200px;background:#1a1a1d;border:1px solid #232326;border-radius:16px;padding:16px;text-align:center}
    .stat b{display:block;font-size:22px;color:#4CAF50}
    table{width:100%;border-collapse:collapse;margin-top:20px}
    th,td{padding:12px;border-bottom:1px solid #232326;text-align:left}
    th{background:#1a1a1d;color:#4CAF50}
    tr:hover{background:#1f2023}
    button{padding:6px 12px;border:none;border-radius:6px;cursor:pointer;margin-right:6px}
    button.view{background:#2196F3;color:#fff}
    button.ban{background:#f44336;color:#fff}
    button.promote{background:#4CAF50;color:#fff}
    button.suspend{background:#f44336;color:#fff}
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#121214;border-top:1px solid #232326;display:flex;justify-content:space-around;padding:10px 0;z-index:20}
    .bottom-nav a{color:#888;text-decoration:none;font-size:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
    .bottom-nav a.active{color:#4CAF50;font-weight:700}
    @media(max-width:600px){
      table,thead,tbody,tr,td,th{display:block}
      tr{margin-bottom:12px}
      td{padding:8px;border:none}
      th{display:none}
    }
  </style>
</head>
<body>
  <div class="top"><div class="logo">Users</div><div style="display:flex;align-items:center;gap:12px"><a href="/admin-panel/inbox.html" style="display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:#18181b;border:1px solid #2f2f32;color:#fff;text-decoration:none" title="Inbox"><i class="fas fa-inbox"></i></a></div></div>
  <div class="container">
    <h2>Users</h2>
    <div class="stats">
      <div class="stat">
        <small>Health Score</small>
        <b id="healthScore">0%</b>
        <small id="userBreakdown"></small>
      </div>
      <div class="stat">
        <small>Total Users</small>
        <b id="totalUsers">0</b>
        <small id="userGrowth"></small>
      </div>
    </div>
    <h3>User List</h3>
    <table id="usersTable">
      <thead>
        <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="bottom-nav">
    <a href="/admin-panel/carbinate.html"><i class="fas fa-house"></i>Home</a>
    <a href="/admin-panel/users.html" class="active"><i class="fas fa-users"></i>Users</a>
    <a href="/admin-panel/withdrawals.html"><i class="fas fa-wallet"></i>Withdrawals</a>
    <a href="/admin-panel/past.html"><i class="fas fa-clock-rotate-left"></i>History</a>
    <a href="/admin-panel/charts.html"><i class="fas fa-chart-line"></i>Charts</a>
    <a href="/admin-panel/messages.html"><i class="fas fa-envelope"></i>Messages</a>
  </div>
  <script>
    function checkAuth() {
      const token = localStorage.getItem('adminToken');
      if (!token) {
        location.href = '/admin-panel/verify.html';
        return false;
      }
      return true;
    }

    async function loadUsers() {
      try {
        const token = localStorage.getItem('adminToken');
        const res = await fetch('/api/admin/users', {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          credentials: 'include'
        });
        
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        
        document.getElementById('healthScore').textContent = `${data.healthScore || 0}%`;
        document.getElementById('userBreakdown').textContent = `Real: ${data.real || 0} | Bots: ${data.bots || 0}`;
        document.getElementById('totalUsers').textContent = data.total || 0;
        document.getElementById('userGrowth').textContent = `Today: ${data.today || 0} | Week: ${data.week || 0} | Month: ${data.month || 0}`;
        
        const tbody = document.querySelector('#usersTable tbody');
        if ((data.users || []).length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#888;">No users yet</td></tr>';
        } else {
          tbody.innerHTML = data.users.map(u=>`
            <tr>
              <td>${u.name}</td>
              <td>${u.email}</td>
              <td>${u.role}</td>
              <td>${u.status}</td>
              <td>
                <button class="view" onclick="viewUser('${u.id}')">View</button>
                <button class="ban" onclick="updateUser('${u.id}','banned')">Ban</button>
                <button style="background:#ff9800;color:#fff" onclick="updateUser('${u.id}','suspend')">Suspend</button>
                <button class="promote" onclick="updateUser('${u.id}','promote')">Promote</button>
              </td>
            </tr>`).join('');
        }
      } catch(err) {
        console.error('Users load error:', err);
        document.querySelector('#usersTable tbody').innerHTML = `<tr><td colspan="5" style="color:#f44336;text-align:center;">Error loading users: ${err.message}</td></tr>`;
      }
    }

    function viewUser(id){
      // open admin user profile page in admin panel
      window.location.href = `/admin-panel/user-profile.html?id=${id}`;
    }

    function updateUser(id, action){
      const token = localStorage.getItem('adminToken');
      showToast('Processing...', 'info');
      fetch(`/api/admin/users/${encodeURIComponent(id)}`,{
        method:'PUT',
        headers:{
          'Content-Type':'application/json',
          'Authorization': `Bearer ${token}`
        },
        body:JSON.stringify({action})
      }).then(async (res)=>{
        const json = await res.json().catch(()=>({}));
        if(res.ok) {
          showToast(json.message || 'Action completed', 'success');
          setTimeout(()=>location.reload(), 900);
        } else {
          showToast(json.error || 'Action failed', 'error');
        }
      }).catch((e)=>{ showToast('Request failed', 'error'); console.error(e); });
    }

    // Simple toast helper
    function showToast(msg, type='info'){
      let el = document.getElementById('admin-toast');
      if(!el){
        el = document.createElement('div'); el.id = 'admin-toast';
        el.style.position = 'fixed'; el.style.bottom = '20px'; el.style.right = '20px'; el.style.padding='10px 14px'; el.style.borderRadius='8px'; el.style.zIndex='9999'; el.style.color='#fff'; el.style.fontWeight='700';
        document.body.appendChild(el);
      }
      el.style.background = (type==='success')? '#4CAF50' : (type==='error')? '#f44336' : '#333';
      el.innerText = msg;
      el.style.display = 'block';
      setTimeout(()=>{ if(el) el.style.display='none'; }, 3000);
    }

    if (checkAuth()) {
      loadUsers();
    }
  </script>
</body>
</html>
