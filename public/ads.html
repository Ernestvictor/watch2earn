        .status-message {

        .status-error {

        .nav-tabs {

    <!-- Firebase Auth -->
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const MAX_ADS = 5;
        const NETWORK_AD_URL = 'https://www.effectivecpmnetwork.com/ke7tsjm03d?key=a96268fc04237d289e7e7bd64904e2f6';
        let current = null;

        const firebaseConfig = {
            apiKey: "AIzaSyABwRXsJmJV4-P9TiFbWxzv6BqhYGBApJ4",
            authDomain: "watch2earn2-3f6fa.firebaseapp.com",
            projectId: "watch2earn2-3f6fa",
            storageBucket: "watch2earn2-3f6fa.appspot.com",
            messagingSenderId: "603283388819",
            appId: "1:603283388819:web:d19c949a688e313ee8b19a"
        };

        firebase.initializeApp(firebaseConfig);

        firebase.auth().onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            await loadBalance();
            await renderAds();
        });

        async function token() {
            return await firebase.auth().currentUser.getIdToken();
        }

        async function loadBalance() {
            try {
                const response = await fetch('/api/transactions/balance', {
                    headers: {
                        'Authorization': 'Bearer ' + (await token())
                    }
                });

                if (!response.ok) throw new Error('Failed to load balance');

                const data = await response.json();

                // Convert USD to Naira (1 USD = 1500 NGN) and format
                const totalNaira = (data.balanceUsd || 0) * 1500;
                const adsNaira = (data.adsEarnUsd || 0) * 1500;
                const surveysNaira = (data.surveyEarnUsd || 0) * 1500;
                const gamesNaira = (data.gameEarnUsd || 0) * 1500;
                const referralNaira = (data.referralEarnUsd || 0) * 1500;

                document.getElementById('totalBalance').textContent = '₦' + totalNaira.toLocaleString('en-NG', { maximumFractionDigits: 2 });
                document.getElementById('adsEarned').textContent = '₦' + adsNaira.toLocaleString('en-NG', { maximumFractionDigits: 2 });
                document.getElementById('surveysEarned').textContent = '₦' + surveysNaira.toLocaleString('en-NG', { maximumFractionDigits: 2 });
                document.getElementById('gamesEarned').textContent = '₦' + gamesNaira.toLocaleString('en-NG', { maximumFractionDigits: 2 });
                document.getElementById('referralEarned').textContent = '₦' + referralNaira.toLocaleString('en-NG', { maximumFractionDigits: 2 });
                document.getElementById('adCount').textContent = data.adCount || 0;
            } catch (error) {
                console.error('Error loading balance:', error);
            }
        }

        async function renderAds() {
            try {
                const response = await fetch('/api/ads');
                if (!response.ok) throw new Error('Failed to load ads');

                const ads = await response.json();
                const container = document.getElementById('adsContainer');

                if (!ads || ads.length === 0) {
                    container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #999;">No ads available right now</p>';
                    return;
                }

                container.innerHTML = ads.map((ad, idx) => `
                    <div class="ad-card">
                        <div class="ad-title">📺 ${ad.title}</div>
                        <div class="ad-info">${ad.seconds || 15} seconds • Network Ad</div>
                        <div class="ad-reward">Earn ₦2.00</div>
                        <button class="watch-btn" id="btn-${idx}" onclick="watch('${ad.id}', ${idx}, this)">
                            Start ${ad.seconds || 15}-second Ad
                        </button>
                        <div class="timer" id="timer-${idx}"></div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error rendering ads:', error);
            }
        }

        async function watch(adId, idx, button) {
            if (current) return;

            current = { adId, idx };
            button.disabled = true;
            button.textContent = 'Ad opened — keep it open...';

            try {
                const response = await fetch('/api/ads');
                if (!response.ok) throw new Error('Failed to load ads');
                const ads = await response.json();
                const ad = ads.find(a => a.id === adId);
                if (!ad) throw new Error('Ad not found');

                const requiredSeconds = Math.max(15, Number(ad.seconds) || 15);
                const url = ad.redirectUrl || ad.url || NETWORK_AD_URL;
                const popup = window.open(url, '_blank', 'noopener,noreferrer');

                if (!popup) {
                    status('Unable to open ad. Please disable your popup blocker.', 'error');
                    button.disabled = false;
                    button.textContent = `Start ${requiredSeconds}-second Ad`;
                    current = null;
                    return;
                }

                const started = Date.now();
                let remaining = requiredSeconds;
                const timerEl = document.getElementById(`timer-${idx}`);
                timerEl.textContent = remaining + 's';

                const interval = setInterval(() => {
                    remaining--;
                    timerEl.textContent = remaining > 0 ? remaining + 's' : '0s';
                }, 1000);

                const finish = async (completed) => {
                    clearInterval(interval);
                    if (current !== null) current = null;
                    timerEl.textContent = '';
                    button.disabled = false;
                    button.textContent = `Start ${requiredSeconds}-second Ad`;

                    if (!completed) {
                        status('Returned before 15 seconds. No reward was added.', 'error');
                        return;
                    }

                    try {
                        const authToken = await token();
                        const elapsedSeconds = Math.min(requiredSeconds, Math.max(0, Math.round((Date.now() - started) / 1000)));
                        // Credit via server endpoint - use signed cookie on server to enforce browser limits
                        try {
                            const creditResponse = await fetch('/api/credit-ad', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({ email: (firebase.auth().currentUser && firebase.auth().currentUser.email) || '' })
                            });

                            const result = await creditResponse.json();

                            if (!creditResponse.ok) {
                                status(result.error || 'The ad could not be credited.', 'error');
                                return;
                            }

                            status(`Ad completed! ₦2.00 saved. ${result.adsLeft || 0}/${MAX_ADS} today.`, 'success');
                            await loadBalance();
                        } catch (e) {
                            status('Unable to credit the ad.', 'error');
                        }
                    } catch (error) {
                        status(error.message || 'Unable to credit the ad.', 'error');
                    }
                };

                const check = setInterval(() => {
                    if (popup.closed) {
                        clearInterval(check);
                        finish(Date.now() - started >= requiredSeconds * 1000);
                    }
                }, 500);

                setTimeout(() => {
                    if (current && current.adId === adId) {
                        clearInterval(check);
                        try { popup.close(); } catch (e) {}
                        finish(true);
                    }
                }, (requiredSeconds + 1) * 1000);

            } catch (error) {
                status(error.message || 'An error occurred.', 'error');
                button.disabled = false;
                button.textContent = `Start ${ad.seconds || 15}-second Ad`;
                current = null;
            }
        }

        function status(msg, type = 'success') {
            const el = document.getElementById('statusMessage');
            el.textContent = msg;
            el.className = `status-message status-${type}`;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 5000);
        }

        async function handleOfferClick() {
            const btn = document.getElementById('offerClickBtn');
            const countdown = document.getElementById('offerCountdown');

            if (btn.disabled) return;

            try {
                const token = localStorage.getItem('authToken');
                const firebaseUid = localStorage.getItem('firebaseUid');

                if (!token || !firebaseUid) {
                    status('Please sign in first', 'error');
                    return;
                }

                // Disable button immediately and open the external offer
                btn.disabled = true;
                btn.textContent = 'Offer opened — waiting...';

                // Open external offer in new window (the ad network link)
                window.open('https://www.effectivecpmnetwork.com/ke7tsjm03d?key=a96268fc04237d289e7e7bd64904e2f6', '_blank', 'noopener,noreferrer');

                // Start 15-second countdown
                let seconds = 15;
                countdown.style.display = 'inline';
                countdown.textContent = `Wait ${seconds}s...`;
                btn.textContent = `Wait ${seconds}s...`;

                const interval = setInterval(() => {
                    seconds--;
                    if (seconds > 0) {
                        countdown.textContent = `Wait ${seconds}s...`;
                        btn.textContent = `Wait ${seconds}s...`;
                    } else {
                        clearInterval(interval);
                        countdown.style.display = 'none';

                        // AFTER 15 seconds, credit the user
                        creditOfferCompletion(firebaseUid, token, btn);
                    }
                }, 1000);

            } catch (error) {
                status(error.message || 'Unable to process offer', 'error');
                btn.disabled = false;
                btn.textContent = 'Open network offer';
            }
        }

        async function creditOfferCompletion(firebaseUid, token, btn) {
            try {
                // Call backend to credit the user AFTER 15 seconds
                const response = await fetch('/api/earning/offer-click', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ firebaseUid })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to credit offer');
                }

                const result = await response.json();
                status(`✅ Offer completed! Earned ₦2.00! New wallet: ₦${(result.newWallet).toFixed(2)}`, 'success');

                // Re-enable button for next offer
                btn.disabled = false;
                btn.textContent = 'Open network offer';

                // Reload balance to reflect any referral earnings
                loadBalance();
            } catch (error) {
                status(error.message || 'Unable to credit offer', 'error');
                btn.disabled = false;
                btn.textContent = 'Open network offer';
            }
        }
    </script>
