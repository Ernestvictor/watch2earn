<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="user.css">

 <script src="https://cdn.gamemonetize.com/sdk.js" data-game-id="7ubj0focn2ah0c9km8a4bxzskl6emjuy"></script>
<style>
body{background:#070709;color:#fff;font-family:Segoe UI,Arial,sans-serif;padding-bottom:80px;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#121214;border-bottom:1px solid #232326;position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:16px;display:flex;align-items:center;gap:6px;color:#fff}
.logo span{color:#4CAF50}
.site-logo{height:32px}
.container{max-width:500px;margin:0 auto;padding:12px}
.card{background:#121214;border:1px solid #232326;border-radius:16px;padding:16px;margin-bottom:12px}
.card.premium{background:linear-gradient(135deg,#1a2810,#0f1608);border:2px solid #4CAF50}
.card h1{font-size:32px;margin:12px 0;font-weight:900;color:#4CAF50}
.strike-icon{font-size:64px;text-align:center;margin:16px 0;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
.muted{color:#aaa;font-size:12px;line-height:1.5}
.btn{width:100%;padding:12px;border-radius:12px;border:none;font-weight:700;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px}
.btn-primary{background:#4CAF50;color:#fff}
.btn-primary:disabled{background:#1a1a1d;color:#555;cursor:not-allowed}
.status{margin-top:12px;padding:12px;background:#0f0f0f;border-radius:10px;border-left:3px solid #4CAF50;color:#4CAF50;font-weight:700;text-align:center}
.status.error{border-left-color:#f44336;color:#f44336}
.reward-display{background:#0f0f0f;border:2px solid #4CAF50;border-radius:12px;padding:16px;text-align:center;margin:12px 0}
.reward-display .amount{font-size:28px;color:#4CAF50;font-weight:900}
.reward-display .label{color:#aaa;font-size:12px;margin-top:4px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#0f0f10;border-top:1px solid #232326;display:flex;justify-content:space-around;padding:10px 0;z-index:20;width:100%}
.bottom-nav a{color:#666;text-decoration:none;font-size:11px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.bottom-nav a.active{color:#4CAF50;font-weight:700}
</style>
<script id="aclib" type="text/javascript" src="//acscdn.com/script/aclib.js"></script>
</head>
<body>
<div class="top">
  <div class="logo"><img src="assets/logo.svg" alt="Watch2Earn" class="site-logo"><span>Watch2Earn</span></div>
  <a href="home.html" style="color:#666;text-decoration:none"><i class="fas fa-arrow-left"></i></a>
</div>

<div class="container">
  <div class="card premium">
    <h1>🔥 Daily Strike</h1>
    <p class="muted">Claim your daily bonus once every 24 hours. The more you earn, the more you can withdraw!</p>
    <div class="strike-icon">⚡</div>
    <div class="reward-display">
      <div class="amount">+$0.01</div>
      <div class="label">≈ ₦15 per claim</div>
    </div>
    <button id="claimBtn" class="btn btn-primary" onclick="claimStrike()">Claim Daily Strike</button>
    <div id="status"></div>
  </div>

  <div class="card">
    <b>How it works</b>
    <p class="muted" style="margin-top:8px">
      • Claim once per day<br>
      • Maximum once per 24 hours<br>
      • Instant credit to your balance<br>
      • No tasks required!
    </p>
  </div>
</div>

<div class="bottom-nav">
  <a href="home.html"><i class="fas fa-house"></i>Home</a>
  <a href="earn.html"><i class="fas fa-coins"></i>Earn</a>
  <a href="history.html"><i class="fas fa-clock-rotate-left"></i>History</a>
  <a href="account.html"><i class="fas fa-user"></i>Account</a>
</div>

<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
<script>
if(!firebase.apps.length){
  const firebaseConfig={apiKey:'AIzaSyDnfD0bTUGE12YhwZCnCsR8JN3OVft6El0',authDomain:'enable-authentication-1b56c.firebaseapp.com',projectId:'enable-authentication-1b56c',storageBucket:'enable-authentication-1b56c.firebasestorage.app',messagingSenderId:'946417281410',appId:'1:946417281410:web:7f4e06e3b4b03946d0079b'};
  firebase.initializeApp(firebaseConfig);
}

firebase.auth().onAuthStateChanged(user=>{
  if(!user) return location.href='login.html';
  loadStrikeStatus(user);
});

async function loadStrikeStatus(user){
  const status = document.getElementById('status');
  const btn = document.getElementById('claimBtn');
  try{
    const token = await user.getIdToken();
    const res = await fetch('/api/transactions/history', { headers: { 'Authorization': 'Bearer ' + token } });
    if(res.ok){
      const txs = await res.json();
      const today = new Date().toDateString();
      const strike = txs.find(t => t.type === 'strike' && new Date(t.date).toDateString() === today);
      if(strike){
        btn.disabled = true;
        btn.innerText = 'Already Claimed Today';
        status.className = 'status';
        status.innerText = 'You have already claimed your daily strike today.';
      }
    }
  }catch(e){
    console.warn('Strike status failed', e);
  }
}

async function claimStrike(){
  const btn = document.getElementById('claimBtn');
  const status = document.getElementById('status');
  btn.disabled = true;
  btn.innerText = 'Processing...';
  try{
    const user = firebase.auth().currentUser;
    const token = await user.getIdToken();
    const res = await fetch('/api/transactions/claim-strike',{method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}});
    const data = await res.json();
    if(res.ok){
      status.className = 'status';
      status.innerText = '✅ Claimed! +$'+(data.amount||0.01).toFixed(2)+' added to your balance';
      btn.disabled = true;
      btn.innerText = 'Already Claimed Today';
      await fetch('/api/transactions/balance', { headers: { 'Authorization': 'Bearer ' + token }});
      setTimeout(()=>{ location.href='home.html'; }, 2000);
    } else {
      status.className = 'status error';
      status.innerText = data.error || 'Could not claim';
      btn.disabled = false;
      btn.innerText = 'Claim Daily Strike';
    }
  }catch(e){ 
    status.className = 'status error';
    status.innerText = 'Error: '+e.message; 
    btn.disabled = false;
    btn.innerText = 'Claim Daily Strike';
  }
}
</script>
