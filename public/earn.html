<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Earn - Watch2Earn</title>
<link rel="stylesheet" href="user.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
 <script src="https://cdn.gamemonetize.com/sdk.js" data-game-id="7ubj0focn2ah0c9km8a4bxzskl6emjuy"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#fff;font-family:Segoe UI,Arial,sans-serif;padding-bottom:85px}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#0f0f0f;border-bottom:1px solid #222;position:sticky;top:0}
.top-left{display:flex;align-items:center;gap:10px}
.logo{font-weight:800;font-size:20px;display:flex;gap:8px;align-items:center}
.logo span{color:#4CAF50}
.site-logo{height:36px}
.action-btns{display:flex;gap:10px}
.icon-btn{width:38px;height:38px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none}
.container{max-width:500px;margin:0 auto;padding:16px}
.dashboard{background:linear-gradient(135deg,#111,#1a2e1a);border:1px solid #2a4a2a;border-radius:20px;padding:18px;margin:16px 0}
.dashboard h1{font-size:34px;font-weight:900}
.earn-stats{display:flex;gap:10px;margin-top:12px}
.stat{flex:1;background:#0f0f0f;border:1px solid #222;border-radius:12px;padding:10px;text-align:center}
.stat b{color:#4CAF50;display:block}
.tabs{display:flex;gap:8px;margin:14px 0;background:#111;border:1px solid #222;border-radius:14px;padding:6px}
.tab{flex:1;padding:10px;text-align:center;border-radius:10px;font-weight:700;cursor:pointer}
.tab.active{background:#4CAF50;color:#fff}
.ad-card{background:#111;border:1px solid #222;border-radius:16px;padding:14px;margin-bottom:12px}
.payout-box{background:#0f0f0f;border:1px solid #1e1e1e;border-radius:10px;padding:8px 12px;text-align:right}
.payout-box .company{color:#888;font-size:11px}
.payout-box .you{color:#4CAF50;font-weight:800}
.btn-watch{background:#4CAF50;color:#fff;width:100%;margin-top:10px;padding:10px;border-radius:10px;border:none;font-weight:700}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#0f0f0f;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px 0;width:100%;max-width:500px;margin:0 auto}
.bottom-nav a{color:#666;text-decoration:none;font-size:11px;text-align:center}
.bottom-nav a.active{color:#4CAF50}
.bottom-nav a i{display:block;font-size:20px}
.announcement{background:#1a1a1d;padding:12px;border-radius:12px;margin:14px 0 12px;color:#fff}
.announcement i{color:#4CAF50;margin-right:6px}
.helper{margin:0 0 12px;color:#888;font-size:12px}

/* Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;min-width:220px;max-width:90%;background:rgba(0,0,0,0.85);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,0.6);display:none;z-index:10000}
.toast.success{border-left:6px solid #4CAF50}
.toast.warn{border-left:6px solid #FF9800}
.toast.error{border-left:6px solid #f44336}

/* Live ad status banner */
.live-status{background:#0f2f1a;border:1px solid #123218;color:#dff6e2;padding:10px;border-radius:10px;margin-bottom:12px;font-weight:700}

@media(max-width:480px){
  body{font-size:18px}
  .container{padding:20px}
  .site-logo{height:44px}
  .btn-watch{padding:14px}
  .tabs .tab{padding:12px;font-size:15px}
}
</style>
<script src="https://pl30708906.profitableratecpmnetwork.com/f2/0a/64/f20a64eb43c44172c8e55cd3d4f83180.js"></script>
<script>
(function () {
  const sameOrigin = new URL(location.href).origin;
  function isAllowedUrl(url) {
    try {
      const u = new URL(url, location.href);
      return u.origin === sameOrigin || u.hostname === 't.me' || u.hostname.endsWith('watch2earn.com') || u.hostname.endsWith('watch2earn.net') || u.hostname.endsWith('watch2earn.app');
    } catch (error) {
      return true;
    }
  }

  const realOpen = window.open;
  window.open = function (url, name, specs) {
    if (!url) return realOpen.call(this, url, name, specs);
    return isAllowedUrl(url) ? realOpen.call(this, url, name, specs) : null;
  };

  document.addEventListener('click', function (event) {
    const link = event.target && event.target.closest ? event.target.closest('a') : null;
    if (!link || !link.href) return;
    if (!isAllowedUrl(link.href)) {
      event.preventDefault();
      event.stopImmediatePropagation();
    }
  }, true);
})();
