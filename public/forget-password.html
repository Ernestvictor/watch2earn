<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch2Earn - Forgot Password</title>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background:#070709; font-family:Segoe UI, Arial, sans-serif; color:#fff; display:flex; justify-content:center; align-items:center; min-height:100vh; }
    .container { max-width:420px; width:90%; padding:22px; background:#111; border:1px solid #222; border-radius:12px; }
    h1 { color:#4CAF50; margin-bottom:8px; text-align:center; }
    p { color:#b6b6b6; font-size:14px; line-height:1.6; text-align:center; }
    input { width:100%; padding:12px; margin:12px 0; border-radius:8px; border:1px solid #3a3a3a; background:#1b1b1d; color:#fff; box-sizing:border-box; }
    button { width:100%; background:#4CAF50; color:#fff; border:none; border-radius:8px; padding:12px; cursor:pointer; font-weight:700; }
    button:disabled { opacity:0.7; cursor:not-allowed; }
    .success { color:#78e08f; display:none; margin-top:10px; }
    .error { color:#ff8c8c; display:none; margin-top:10px; }
    a { color:#4CAF50; text-decoration:none; }
  </style>
</head>
<body>
  <div class="container">
    <h1><i class="fas fa-key"></i> Reset Password</h1>
    <p>Enter your email and Firebase will send a password reset link to your inbox.</p>
    <form id="resetForm">
      <input type="email" id="resetEmail" placeholder="Your email address" required>
      <button type="submit" id="resetBtn">Send Reset Link</button>
      <div id="successMsg" class="success"></div>
      <div id="errorMsg" class="error"></div>
    </form>
    <p style="margin-top:16px"><a href="login.html">Back to Login</a></p>
  </div>

  <script src="/js/app.js"></script>
  <script>
    window.w2e.initFirebase();
    const form = document.getElementById('resetForm');
    const emailInput = document.getElementById('resetEmail');
    const resetBtn = document.getElementById('resetBtn');
    const successMsg = document.getElementById('successMsg');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      successMsg.style.display = 'none';
      errorMsg.style.display = 'none';
      const email = emailInput.value.trim();
      if (!email) {
        errorMsg.textContent = 'Please enter your email.';
        errorMsg.style.display = 'block';
        return;
      }

      resetBtn.disabled = true;
      resetBtn.textContent = 'Sending...';

      try {
        await firebase.auth().sendPasswordResetEmail(email);
        successMsg.textContent = 'Password reset email sent. Please check your inbox and spam folder.';
        successMsg.style.display = 'block';
        form.reset();
      } catch (err) {
        errorMsg.textContent = err.message || 'Unable to send reset email.';
        errorMsg.style.display = 'block';
      } finally {
        resetBtn.disabled = false;
        resetBtn.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
