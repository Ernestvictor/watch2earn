<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch2Earn - Login</title>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
  <script src="https://cdn.gamemonetize.com/sdk.js" data-game-id="7ubj0focn2ah0c9km8a4bxzskl6emjuy"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background:#070709; font-family:Segoe UI, Arial, sans-serif; color:#fff; display:flex; justify-content:center; align-items:center; height:100vh; }
    .container { max-width:400px; width:100%; padding:20px; background:#111; border-radius:12px; text-align:center; }
    h1 { color:#4CAF50; margin-bottom:10px; }
    input { width:100%; padding:12px; margin:10px 0; border-radius:6px; border:1px solid #444; background:#222; color:#fff; box-sizing:border-box; }
    button { width:100%; padding:12px; background:#4CAF50; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:bold; }
    button:disabled { background:#333; cursor:not-allowed; }
    a { color:#4CAF50; text-decoration:none; }
    .error { color:#ff6b6b; font-size:13px; margin-top:8px; }
    .links { margin-top:15px; font-size:13px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Watch2Earn 💎</h1>
    <h2>Login</h2>
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginPassword" placeholder="Password" required />
      <button type="submit" id="loginBtn">Login</button>
      <div id="errorMsg" class="error"></div>
    </form>
    <div class="links">
      <p>Don't have an account? <a href="index.html">Sign Up</a></p>
      <p><a href="forget-password.html">Forgot Password?</a></p>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    window.w2e.initFirebase();

    const form=document.getElementById('loginForm');
    const btn=document.getElementById('loginBtn');
    const errorMsg=document.getElementById('errorMsg');

    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        window.location.href = 'home.html';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.innerText='';
      btn.disabled=true;
      btn.innerText='Signing in...';
      const email=document.getElementById('loginEmail').value.trim();
      const password=document.getElementById('loginPassword').value;

      try {
        const cred = await firebase.auth().signInWithEmailAndPassword(email, password);
        const user = cred.user;
        if (user && !user.emailVerified) {
          // If not verified, sign out and ask to verify
          await firebase.auth().signOut();
          errorMsg.innerText = '✗ Email not verified. Check your inbox or spam.';
          btn.disabled=false;
          btn.innerText='Login';
          return;
        }

        // Check user status (suspended, banned, etc)
        try {
          const statusRes = await fetch('/api/auth/status', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          const statusData = await statusRes.json();
          if (statusData.redirect) {
            // Redirect based on user status
            window.location.href = statusData.redirect;
            return;
          }
        } catch (statusErr) {
          console.warn('Status check failed, continuing to home:', statusErr);
        }

        // Default redirect to home
        window.location.href = 'home.html';
      } catch (error) {
        errorMsg.innerText = error.message || 'Unable to sign in.';
        btn.disabled=false;
        btn.innerText='Login';
      }
    });
  </script>
</body>
</html>
