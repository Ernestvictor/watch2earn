<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Inbox - Watch2Earn</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #050505;
  color: #fff;
  font-family: 'Segoe UI', Arial, sans-serif;
  padding-bottom: 90px;
}
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px;
  background: #0f0f0f;
  border-bottom: 1px solid #222;
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 800;
  font-size: 20px;
}
.logo span { color: #4CAF50; }
.site-logo { height: 36px; }
.top-actions { display: flex; gap: 10px; align-items: center; }
.icon-btn {
  width: 38px;
  height: 38px;
  background: #1a1a1a;
  border: 1px solid #2a2a2a;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  text-decoration: none;
  position: relative;
  cursor: pointer;
}
.container { max-width: 760px; margin: 0 auto; padding: 16px; }
.card {
  background: #111;
  border: 1px solid #222;
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 14px;
}
.section-title {
  font-size: 15px;
  font-weight: 800;
  color: #4CAF50;
  margin: 0 0 12px;
}
.message-item {
  background: #0f0f0f;
  border: 1px solid #222;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: 0.2s ease;
}
.message-item:hover { border-color: #4CAF50; }
.message-item.unread {
  border-left: 3px solid #f44336;
  background: rgba(244, 67, 54, 0.08);
}
.title {
  font-weight: 800;
  color: #fff;
  margin-bottom: 6px;
}
.meta {
  color: #888;
  font-size: 11px;
  margin-bottom: 7px;
}
.body {
  color: #ddd;
  font-size: 14px;
  line-height: 1.5;
  white-space: pre-wrap;
}
.empty {
  padding: 18px;
  text-align: center;
  color: #888;
  background: #0d0d0d;
  border: 1px dashed #333;
  border-radius: 12px;
}
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #0f0f0f;
  border-top: 1px solid #222;
  display: flex;
  justify-content: space-around;
  padding: 10px 0;
  max-width: 480px;
  margin: 0 auto;
}
.bottom-nav a {
  color: #666;
  text-decoration: none;
  font-size: 11px;
  text-align: center;
}
.bottom-nav a.active { color: #4CAF50; }
.bottom-nav a i { display: block; font-size: 20px; }
.badge {
  position: absolute;
  top: -6px;
  right: -6px;
  background: #f44336;
  color: #fff;
  border-radius: 50%;
  min-width: 20px;
  height: 20px;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 800;
  padding: 0 4px;
}
@media (min-width: 768px) {
  .container { max-width: 900px; }
  .message-item { padding: 18px; }
}
</style>
</head>
<body>
  <div class="top-bar">
    <div class="logo"><img src="assets/logo.svg" alt="Watch2Earn" class="site-logo" /><span>Watch2Earn</span></div>
    <div class="top-actions">
      <a href="home.html" class="icon-btn" title="Home"><i class="fas fa-house"></i></a>
      <a href="earn.html" class="icon-btn" title="Earn"><i class="fas fa-coins"></i></a>
      <a href="account.html" class="icon-btn" title="Account"><i class="fas fa-user"></i></a>
      <div class="icon-btn" title="Notifications" aria-label="Notifications">
        <i class="fas fa-bell"></i>
        <span id="notificationBadge" class="badge">0</span>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <h2 style="color:#4CAF50;margin:0 0 8px"><i class="fas fa-inbox"></i> Inbox</h2>
      <p style="color:#888;font-size:13px;margin:0">System updates, announcements, and admin messages appear here live.</p>
    </div>

    <div id="messageList"></div>
  </div>

  <div class="bottom-nav">
    <a href="home.html"><i class="fas fa-house"></i>Home</a>
    <a href="earn.html"><i class="fas fa-coins"></i>Earn</a>
    <a href="history.html"><i class="fas fa-clock-rotate-left"></i>History</a>
    <a href="account.html" class="active"><i class="fas fa-user"></i>Account</a>
  </div>

  <script>
    const badge = document.getElementById('notificationBadge');
    const messageList = document.getElementById('messageList');
    const READING_KEY = 'watch2earn_read_inbox_messages';

    function getReadSet() {
      try {
        return new Set(JSON.parse(localStorage.getItem(READING_KEY) || '[]'));
      } catch (e) {
        return new Set();
      }
    }

    function setReadSet(ids) {
      localStorage.setItem(READING_KEY, JSON.stringify([...ids]));
    }

    function getItemId(item) {
      return String(item.id || item._id || item.createdAt || Math.random().toString(36));
    }

    function renderSection(title, items) {
      if (!items.length) return '';

      return `
        <div class="card">
          <div class="section-title">${title}</div>
          ${items.map((item) => {
            const unread = !getReadSet().has(getItemId(item));
            const text = item.message || item.body || item.content || 'No message content';
            const when = item.createdAt ? new Date(item.createdAt).toLocaleString() : 'Just now';
            return `
              <div class="message-item ${unread ? 'unread' : ''}" data-id="${getItemId(item)}" title="Click to mark as read">
                <div class="title">${item.title || item.type || 'Message'}</div>
                <div class="meta">${when} • ${item.channel || item.type || 'Admin'}</div>
                <div class="body">${text}</div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    async function loadMessages() {
      try {
        const res = await fetch('/api/messages');
        if (!res.ok) throw new Error('Auto inbox unavailable');
        const data = await res.json();
        const allMessages = Array.isArray(data) ? data : (data.messages || []);
        const readIds = getReadSet();
        const unread = allMessages.filter((item) => !readIds.has(getItemId(item)));

        if (unread.length > 0) {
          badge.textContent = unread.length > 99 ? '99+' : unread.length;
          badge.style.display = 'flex';
        } else {
          badge.style.display = 'none';
          badge.textContent = '0';
        }

        const sections = {
          'System Updates': allMessages.filter((m) => ['announcement', 'system', 'warning', 'alert', 'admin'].includes(String(m.type || '').toLowerCase())),
          'Messages': allMessages.filter((m) => !['announcement', 'system', 'warning', 'alert', 'admin'].includes(String(m.type || '').toLowerCase()))
        };

        const html = [
          renderSection('System Updates', sections['System Updates']),
          renderSection('Messages', sections['Messages'])
        ].filter(Boolean).join('');

        messageList.innerHTML = html || '<div class="empty"><i class="fas fa-inbox"></i> No inbox messages yet.</div>';

        messageList.querySelectorAll('.message-item').forEach((card) => {
          card.addEventListener('click', () => {
            const id = card.dataset.id;
            if (!id) return;
            const next = getReadSet();
            next.add(id);
            setReadSet(next);
            loadMessages();
          });
        });
      } catch (e) {
        console.error('Inbox load error:', e);
        messageList.innerHTML = '<div class="empty"><i class="fas fa-exclamation-circle"></i> Unable to load inbox right now.</div>';
      }
    }

    loadMessages();
    setInterval(loadMessages, 30000);
  </script>
</body>
</html>
