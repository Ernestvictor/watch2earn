<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Withdraw - Naira + Crypto | Watch2Earn</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
  <style>
    /* Core styling */
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#070709;color:#fff;font-family:Inter,'Segoe UI',sans-serif;padding-bottom:95px}
    .top{padding:14px 20px;background:#121214;border-bottom:1px solid #232326;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
    .container{max-width:540px;margin:0 auto;padding:14px}
    .card{background:#121214;border:1px solid #232326;border-radius:18px;padding:18px;margin-bottom:12px}
    .card.green{background:linear-gradient(135deg,#121412,#162916);border-color:#1f3d1f}
    .card.tier{cursor:pointer;transition:.2s}
    .card.tier:hover{border-color:#4CAF50;transform:translateY(-2px)}
    .card.tier.selected{border-color:#4CAF50;background:#132a18;box-shadow:0 0 20px rgba(76,175,80,.2)}
    .card.tier.disabled{opacity:.4;pointer-events:none}
    .badge{padding:4px 10px;border-radius:20px;font-size:10px;font-weight:800;display:inline-block}
    .badge-starter{background:#2a1f13;color:#f59e0b}
    .badge-basic{background:#1f1a29;color:#8b5cf6}
    .badge-standard{background:#132a2a;color:#06b6d4}
    .badge-premium{background:#132a18;color:#4CAF50}
    .input{width:100%;padding:13px;background:#0f0f10;border:1px solid #232326;border-radius:12px;color:#fff;margin-bottom:10px;outline:none;font-size:13px}
    .input:focus{border-color:#4CAF50}
    .btn{width:100%;padding:15px;border-radius:14px;border:none;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
    .btn-green{background:#4CAF50;color:#fff}
    .btn-green:disabled{background:#1a1a1d;color:#555}
    .main-tabs{display:flex;gap:8px;background:#121214;padding:6px;border-radius:14px;border:1px solid #232326;margin-bottom:14px}
    .main-tab{flex:1;padding:12px;text-align:center;border-radius:10px;cursor:pointer;font-weight:700;font-size:13px;color:#777;display:flex;align-items:center;justify-content:center;gap:6px}
    .main-tab.active{background:#4CAF50;color:#fff}
    .crypto-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
    .crypto-card{background:#0f0f10;border:1px solid #232326;border-radius:12px;padding:12px;text-align:center;cursor:pointer;transition:.2s}
    .crypto-card:hover{border-color:#4CAF50}
    .crypto-card.selected{border-color:#4CAF50;background:#132a18}
    .crypto-card b{display:block;font-size:12px;margin-top:4px}
    .crypto-card small{font-size:10px;color:#777}
    .divider{height:1px;background:#232326;margin:10px 0}
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#0f0f10;border-top:1px solid #232326;display:flex;justify-content:space-around;padding:10px 0;z-index:20}
    .bottom-nav a{color:#666;text-decoration:none;font-size:11px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
    .bottom-nav a.active{color:#4CAF50}
  </style>
</head>
<body>
  <!-- Top bar -->
  <div class="top">
    <i class="fas fa-arrow-left" onclick="location.href='home.html'" style="cursor:pointer;padding:8px"></i>
    <b>Withdraw - Real Site</b>
    <span style="margin-left:auto;color:#4CAF50;font-weight:800" id="topBal">₦0</span>
  </div>

  <div class="container">
    <!-- Balance card -->
    <div class="card green" style="text-align:center">
      <small style="color:#4CAF50;font-weight:700;letter-spacing:1px">AVAILABLE BALANCE</small>
      <h1 style="font-size:32px;margin:6px 0">₦<span id="bal">0</span></h1>
      <small style="color:#777">$<span id="usdBal">0.00</span> • ₦1500/$1</small>
      <div id="statusMsg" style="margin-top:10px;padding:8px 12px;background:#0f0f10;border-radius:8px;font-size:12px"></div>
    </div>

    <!-- Tabs -->
    <div class="main-tabs">
      <div class="main-tab active" id="tabNaira" onclick="switchMain('naira')"><i class="fas fa-building-columns"></i> Naira Bank</div>
      <div class="main-tab" id="tabCrypto" onclick="switchMain('crypto')"><i class="fab fa-bitcoin"></i> Crypto (10)</div>
    </div>

    <!-- Naira Section -->
    <div id="nairaSection">

      <!-- ... -->
    </div>

    <!-- Crypto Section -->
    <div id="cryptoSection" style="display:none">
      <!-- Tiers + Wallet selection + Details form (already included in your snippets) -->
      <!-- ... -->
    </div>
  </div>

  <!-- Bottom nav -->
  <div class="bottom-nav">
    <a href="home.html"><i class="fas fa-house"></i>Home</a>
    <a href="earn.html"><i class="fas fa-coins"></i>Earn</a>
    <a href="history.html"><i class="fas fa-clock-rotate-left"></i>History</a>
    <a href="withdraw.html" class="active"><i class="fas fa-wallet"></i>Withdraw</a>
  </div>

  <!-- Scripts -->

  <script src="js/app.js"></script>
</body>
</html>
